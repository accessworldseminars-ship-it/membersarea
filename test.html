<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AccessWorld – Complete Portal + Admin</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: linear-gradient(145deg, #0F172A 0%, #111827 100%); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; min-height: 100vh; padding: 24px 20px; }
.portal { max-width: 1400px; margin: 0 auto; background: #ffffff; border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4); overflow: hidden; }

/* Login view */
.login-panel { display: flex; align-items: center; justify-content: center; min-height: 85vh; background: #ffffff; }
.login-card { background: white; padding: 44px 40px; border-radius: 2rem; max-width: 460px; width: 100%; text-align: center; border: 1px solid rgba(201, 168, 76, 0.3); box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08); }
.login-card h1 { font-size: 28px; font-weight: 700; background: linear-gradient(135deg, #1A2744, #2A3A5C); background-clip: text; -webkit-background-clip: text; color: transparent; }
.login-card p { color: #5b6e8c; margin: 10px 0 28px; }
.input-field { margin-bottom: 18px; text-align: left; }
.input-field label { font-size: 12px; font-weight: 600; color: #2c3e66; margin-bottom: 6px; display: block; }
.input-field input { width: 100%; padding: 14px 16px; border: 1.5px solid #e2e8f0; border-radius: 28px; font-size: 15px; transition: 0.2s; background: #fefefe; }
.input-field input:focus { outline: none; border-color: #C9A84C; box-shadow: 0 0 0 3px rgba(201,168,76,0.2); }
.btn { border: none; border-radius: 40px; font-weight: 700; cursor: pointer; transition: 0.2s; }
.btn-primary { background: #1D9E75; color: white; width: 100%; padding: 14px; font-size: 15px; box-shadow: 0 6px 14px rgba(29,158,117,0.3); }
.btn-primary:hover { background: #157f5c; transform: translateY(-1px); }
.btn-outline-gold { background: transparent; border: 1.5px solid #C9A84C; color: #C9A84C; padding: 8px 18px; font-weight: 600; }
.btn-outline-gold:hover { background: #C9A84C; color: #1A2744; }
.btn-gold { background: #C9A84C; color: #1A2744; padding: 8px 18px; font-weight: 700; }
.btn-gold:hover { background: #b8933f; }
.error-message { color: #dc3c4c; font-size: 13px; margin-top: 16px; }

/* Dashboard */
.dashboard-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 32px; background: white; border-bottom: 1px solid #edf2f7; flex-wrap: wrap; gap: 12px; }
.logo-area { display: flex; align-items: center; gap: 14px; }
.logo-area h2 { font-size: 22px; font-weight: 700; color: #1A2744; }
.tier-badge { background: #1D9E75; padding: 6px 18px; border-radius: 40px; font-size: 12px; font-weight: 700; color: white; }
.stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 24px 32px 0 32px; }
.stat-card { background: #F9FAFE; border-radius: 1.5rem; padding: 18px 12px; text-align: center; border: 1px solid #eef2f8; }
.stat-number { font-size: 36px; font-weight: 800; color: #1A2744; }
.stat-label { font-size: 12px; color: #62748c; margin-top: 6px; }
.tabs-row { display: flex; gap: 6px; padding: 20px 32px 0; border-bottom: 1px solid #edf2f7; background: white; flex-wrap: wrap; }
.tab-btn { background: transparent; border: none; padding: 10px 24px; font-weight: 700; font-size: 14px; cursor: pointer; color: #8a99b0; border-radius: 40px; }
.tab-btn.active { background: #1A2744; color: white; }
.content-area { padding: 28px 32px 32px; background: white; }
.two-columns { display: flex; gap: 28px; flex-wrap: wrap; }
.sidebar { width: 280px; flex-shrink: 0; background: #F9FAFE; border-radius: 1.5rem; padding: 18px 14px; max-height: 620px; overflow-y: auto; }
.category-item { padding: 10px 12px; margin-bottom: 6px; border-radius: 14px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 600; font-size: 13px; color: #2c3e66; }
.category-item:hover { background: #eef2fa; }
.category-item.active { background: #1A2744; color: white; }
.cat-count { background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 30px; font-size: 11px; }
.main-panel { flex: 1; }
.video-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }
.video-card { background: white; border: 1.5px solid #eef2f8; border-radius: 18px; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; transition: all 0.2s; }
.video-card:hover { border-color: #C9A84C; }
.video-card.active-video { border-left: 5px solid #1D9E75; background: #F2F9F5; }
.player-panel { margin-top: 28px; background: #F9FAFE; border-radius: 1.5rem; padding: 22px; display: none; }
.player-panel.show { display: block; }
iframe { width: 100%; height: 400px; border-radius: 1.2rem; border: none; background: #000; }
.player-actions { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
@media (max-width: 760px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .sidebar { width: 100%; } .two-columns { flex-direction: column; } iframe { height: 240px; } }

/* Admin panel (embedded style but hidden by default) */
#adminPanel { background: #0c111c; margin-top: 0; border-radius: 1.5rem; padding: 0; }
.admin-header, .toolbar, .bulk-bar, .tabs, .table-wrap, .pagination { margin-left: 20px; margin-right: 20px; }
</style>
</head>
<body>
<div class="portal">

  <!-- LOGIN VIEW (member area) -->
  <div id="loginView">
    <div class="login-panel">
      <div class="login-card">
        <h1>AccessWorld Seminars</h1>
        <p>Sign in to access your member library</p>
        <div class="input-field"><label>Email</label><input type="email" id="loginEmail" placeholder="your@email.com"></div>
        <div class="input-field"><label>Password</label><input type="password" id="loginPassword" placeholder="••••••••"></div>
        <button class="btn btn-primary" id="loginBtn">Sign In →</button>
        <div id="loginErrorMsg" class="error-message"></div>
        <hr style="margin:20px 0 10px">
        <button id="gotoAdminBtn" class="btn btn-outline-gold" style="background:#111; color:#C9A84C;">🔐 Admin Login</button>
      </div>
    </div>
  </div>

  <!-- MEMBER DASHBOARD -->
  <div id="dashboardView" style="display: none;">
    <div class="dashboard-header">
      <div class="logo-area"><h2>AccessWorld Library</h2></div>
      <div style="display:flex; gap:12px; align-items:center;">
        <span id="userTierBadge" class="tier-badge">Tier 1</span>
        <button onclick="memberLogout()" class="btn-outline-gold btn">Sign Out</button>
      </div>
    </div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-number" id="totalVideosStat">0</div><div class="stat-label">Videos</div></div>
      <div class="stat-card"><div class="stat-number" id="watchedStat">0</div><div class="stat-label">Watched</div></div>
      <div class="stat-card"><div class="stat-number" id="notesCountStat">0</div><div class="stat-label">Notes</div></div>
    </div>
    <div class="tabs-row" id="tabContainer">
      <button class="tab-btn active" data-tab="tier1">⭐ Tier 1</button>
      <button class="tab-btn" data-tab="tier2">🚀 Tier 2</button>
      <button class="tab-btn" data-tab="tier3">🏆 Tier 3</button>
      <button class="tab-btn" data-tab="notes">📝 My Notes</button>
    </div>
    <div class="content-area" id="dynamicContent"></div>
  </div>

  <!-- ADMIN PANEL (hidden initially) -->
  <div id="adminPanel" style="display: none; background:#0c111c; color:#e5e7eb; padding-bottom: 30px;">
    <div class="admin-header" style="background:#111827; border-radius:1rem; margin:20px; padding:14px 24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
      <h2 style="color:#C9A84C;">🎛️ AccessWorld Admin</h2>
      <div style="display:flex; gap:12px;">
        <button class="btn btn-outline-gold" onclick="hideAdminShowMember()">← Back to Member Portal</button>
        <button class="btn-outline-gold btn" onclick="adminLogout()">Sign Out</button>
      </div>
    </div>
    <div class="toolbar" style="background:#111827; border-radius:1rem; margin:0 20px 14px; padding:12px 18px; display:flex; gap:10px; flex-wrap:wrap;">
      <input type="text" id="adminSearch" placeholder="🔍 Search by title..." style="flex:1; background:#1f2937; border:1px solid #374151; color:white; padding:8px 16px; border-radius:30px;">
      <select id="adminPerPage" style="background:#1f2937; color:white; border-radius:30px; padding:8px 12px;"><option value="25">25 per page</option><option value="50">50</option><option value="100">100</option><option value="9999">All</option></select>
      <button class="btn-gold btn" onclick="loadAdminVideos()">↺ Refresh</button>
    </div>
    <div class="tabs" style="display:flex; gap:8px; margin:0 20px 14px;">
      <div class="tab active" onclick="setAdminTier('all',this)">All</div>
      <div class="tab" onclick="setAdminTier(1,this)">⭐ Tier1</div>
      <div class="tab" onclick="setAdminTier(2,this)">🚀 Tier2</div>
      <div class="tab" onclick="setAdminTier(3,this)">🏆 Tier3</div>
    </div>
    <div class="bulk-bar" style="background:#111827; border-radius:1rem; margin:0 20px 14px; padding:12px 16px; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
      <label><input type="checkbox" id="adminSelectAllPage"> Select page</label>
      <span id="adminSelCount">0 selected</span>
      <select id="bulkTierSelect"><option value="">Move tier...</option><option value="1">Tier 1</option><option value="2">Tier 2</option><option value="3">Tier 3</option></select>
      <input type="text" id="bulkCatInput" placeholder="Set category" style="background:#1f2937; border:1px solid #374151; color:white; padding:6px 12px; border-radius:30px;">
      <button class="btn-gold btn" onclick="bulkUpdateAdmin()">✓ Apply</button>
      <button class="btn btn-red" style="background:#7f1d1d;" onclick="bulkDeleteAdmin()">🗑️ Delete</button>
      <button class="btn btn-gray" onclick="clearAdminSelection()">✕ Clear</button>
    </div>
    <div class="table-wrap" style="overflow-x:auto; margin:0 20px; border-radius:1rem; background:#111827;">
      <table style="width:100%; border-collapse:collapse; min-width:800px;">
        <thead><tr style="background:#0f1722;"><th style="width:40px"><input type="checkbox" id="adminHeaderCheck"></th><th>ID</th><th>Title</th><th>Category</th><th>Tier</th><th>Sort</th><th>Actions</th></tr></thead>
        <tbody id="adminTableBody"><tr><td colspan="7" style="padding:40px; text-align:center;">Loading...</td></tr></tbody>
      </table>
    </div>
    <div id="adminPagination" style="display:flex; justify-content:center; gap:12px; margin:20px; flex-wrap:wrap;"></div>
  </div>
</div>

<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
// ======================== SUPABASE CONFIG ========================
const SUPABASE_URL = "https://zwwodopezadqjazhajmx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg";
const ADMIN_PASS = "accessworld2025";
let supabaseClient = null;

// Global state for member area
let allVideos = [];
let watchedMap = {};
let userNotes = [];
let currentUserTier = 1;
let activeCategoryId = null;
let activeVideoId = null;
let currentTierView = 1;
let memberSession = null;

// Admin state
let adminVideos = [];
let adminSelectedIds = new Set();
let adminTierFilter = "all";
let adminSearchQuery = "";
let adminCurrentPage = 1;
let adminPerPage = 25;

// Category mapping for member area (rich categories)
const CATEGORIES = [
  { id: "unlock", name: "🌟 Unlock Yourself", tier: 1, kw: ["unlock your incredible", "artistry explained"] },
  { id: "morning", name: "🌅 Morning Routine", tier: 1, kw: ["morning routine"] },
  { id: "group", name: "👥 Group Coaching", tier: 1, kw: ["group coaching", "goal setting", "jan 2024", "apr 2024"] },
  { id: "emotional", name: "💚 Emotional Clearing", tier: 1, kw: ["emotional clearing", "gift process", "yelling"] },
  { id: "health", name: "🏥 Health & Healing", tier: 1, kw: ["acid alkaline", "health & energy", "pain & healing"] },
  { id: "nlp_basic", name: "🧠 NLP Basics", tier: 1, kw: ["nlp basics", "take full control"] },
  { id: "intro", name: "🎓 Free Introductions", tier: 2, kw: ["free introduction", "nlp for beginners", "money mindset"] },
  { id: "wcc", name: "📜 World Class Coach", tier: 2, kw: ["coaching lesson", "world class coach"] },
  { id: "adv_sem", name: "🎪 Advanced Seminars", tier: 3, kw: ["emotional mastery seminar", "holistic health webinar"] },
  { id: "meditation", name: "🧘 Meditations", tier: 1, kw: ["meditation", "the gift", "guided breath"] }
];
function getCategoryForVideo(video) {
  let title = (video.title || "").toLowerCase();
  for (let cat of CATEGORIES) if (cat.kw.some(k => title.includes(k))) return cat;
  return { id: "other", name: "📁 Other Content", tier: video.tier_required || 1 };
}

// ======================== LOCALSTORAGE HELPERS ========================
function loadLocalData() { try { if(localStorage.getItem("aw_watched")) watchedMap = JSON.parse(localStorage.getItem("aw_watched")); if(localStorage.getItem("aw_notes")) userNotes = JSON.parse(localStorage.getItem("aw_notes")); } catch(e) {} }
function saveWatched() { localStorage.setItem("aw_watched", JSON.stringify(watchedMap)); }
function saveNotes() { localStorage.setItem("aw_notes", JSON.stringify(userNotes)); }

// ======================== MEMBER LOGIC ========================
async function memberLogin() {
  let email = document.getElementById("loginEmail").value.trim();
  let pwd = document.getElementById("loginPassword").value;
  let errDiv = document.getElementById("loginErrorMsg");
  if (!email || !pwd) { errDiv.innerText = "Enter email and password."; return; }
  document.getElementById("loginBtn").disabled = true;
  let { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pwd });
  if (error) { errDiv.innerText = error.message; document.getElementById("loginBtn").disabled = false; return; }
  memberSession = data.session;
  let userTier = 1;
  try {
    let { data: prof } = await supabaseClient.from("profiles").select("membership_tier").eq("email", email).maybeSingle();
    userTier = prof?.membership_tier || 1;
  } catch(e) { console.warn(e); }
  currentUserTier = Math.min(userTier, 3);
  document.getElementById("userTierBadge").innerText = currentUserTier >= 3 ? "Full Access" : `Tier ${currentUserTier}`;
  await loadMemberVideos();
  document.getElementById("loginView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";
  document.getElementById("loginBtn").disabled = false;
}
async function loadMemberVideos() {
  let { data, error } = await supabaseClient.from("lessons").select("*").order("sort_order", { ascending: true });
  if (error) { alert("Error loading library"); return; }
  allVideos = data || [];
  updateStats();
  switchMemberTab("tier1");
}
function updateStats() {
  let accessible = allVideos.filter(v => (v.tier_required || 1) <= currentUserTier);
  document.getElementById("totalVideosStat").innerText = accessible.length;
  document.getElementById("watchedStat").innerText = Object.keys(watchedMap).length;
  document.getElementById("notesCountStat").innerText = userNotes.length;
}
function renderMemberTierView(tierNum) {
  currentTierView = tierNum;
  if (tierNum > currentUserTier) {
    document.getElementById("dynamicContent").innerHTML = `<div style="text-align:center;padding:80px;"><h2>🔒 Tier ${tierNum} Locked</h2><p>Upgrade to unlock.</p></div>`;
    return;
  }
  let tierVideos = allVideos.filter(v => (v.tier_required || 1) === tierNum);
  let groups = {};
  tierVideos.forEach(v => { let cat = getCategoryForVideo(v); if (!groups[cat.id]) groups[cat.id] = { ...cat, videos: [] }; groups[cat.id].videos.push(v); });
  let cats = Object.values(groups);
  if (!activeCategoryId || !groups[activeCategoryId]) activeCategoryId = cats[0]?.id;
  let currentCat = groups[activeCategoryId];
  let html = `<div class="two-columns"><div class="sidebar"><h4 style="margin-bottom:12px;">Categories</h4>`;
  cats.forEach(cat => { html += `<div class="category-item ${activeCategoryId === cat.id ? 'active' : ''}" data-catid="${cat.id}">${cat.name} <span class="cat-count">${cat.videos.length}</span></div>`; });
  html += `</div><div class="main-panel">`;
  if (currentCat) {
    html += `<div class="category-title">${currentCat.name}</div><div class="video-list" id="memberVideoList">`;
    currentCat.videos.forEach(v => { let isWatched = !!watchedMap[v.id]; html += `<div class="video-card" data-vid="${v.id}"><div><strong>${escapeHtml(v.title)}</strong></div><div style="color:#1D9E75">${isWatched ? '✓' : '▶'}</div></div>`; });
    html += `</div>`;
  }
  html += `<div id="memberPlayerPanel" class="player-panel"><h3 id="playerTitle"></h3><div id="playerDesc" style="margin-bottom:12px;"></div><iframe id="videoPlayerIframe" src="" allowfullscreen></iframe><div class="player-actions"><button id="watchToggleBtn" class="btn btn-gold">Mark as watched</button><button class="btn btn-outline-gold" onclick="closePlayer()">Close</button></div></div>`;
  html += `</div></div>`;
  document.getElementById("dynamicContent").innerHTML = html;
  document.querySelectorAll('.category-item').forEach(el => { el.addEventListener('click', (e) => { activeCategoryId = el.getAttribute('data-catid'); activeVideoId = null; renderMemberTierView(tierNum); }); });
  document.querySelectorAll('.video-card').forEach(el => { el.addEventListener('click', () => { let vid = parseInt(el.getAttribute('data-vid')); playMemberVideo(vid); }); });
}
function playMemberVideo(videoId) {
  let video = allVideos.find(v => v.id === videoId);
  if (!video) return;
  activeVideoId = videoId;
  let embedUrl = getEmbedUrl(video.video_url || video.google_drive_embed_url || "");
  let iframe = document.getElementById("videoPlayerIframe");
  if (iframe) iframe.src = embedUrl;
  let panel = document.getElementById("memberPlayerPanel");
  if (panel) {
    document.getElementById("playerTitle").innerText = video.title || "Untitled";
    document.getElementById("playerDesc").innerHTML = video.description || "No description.";
    let btn = document.getElementById("watchToggleBtn");
    let isWatched = !!watchedMap[video.id];
    btn.innerText = isWatched ? "✓ Watched" : "Mark as watched";
    btn.onclick = () => { if (watchedMap[video.id]) delete watchedMap[video.id]; else watchedMap[video.id] = Date.now(); saveWatched(); updateStats(); renderMemberTierView(currentTierView); closePlayer(); };
    panel.classList.add("show");
  }
  document.querySelectorAll('.video-card').forEach(c => c.classList.remove('active-video'));
  let activeCard = document.querySelector(`.video-card[data-vid="${videoId}"]`);
  if (activeCard) activeCard.classList.add('active-video');
}
function closePlayer() { let panel = document.getElementById("memberPlayerPanel"); if(panel) panel.classList.remove("show"); }
function getEmbedUrl(raw) { if(!raw) return ""; if(raw.includes("youtu.be")||raw.includes("youtube.com")){ let m=raw.match(/(?:youtu\.be\/|youtube.com\/watch\?v=)([a-zA-Z0-9_-]{11})/); if(m) return `https://www.youtube.com/embed/${m[1]}`; } return raw; }
function switchMemberTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  if(tab === "notes") { document.getElementById("dynamicContent").innerHTML = `<div style="padding:40px;text-align:center;"><h3>📝 My Notes</h3><p>Notes saved locally: ${userNotes.length} items. (Coming soon)</p></div>`; return; }
  let tier = parseInt(tab.replace('tier',''));
  renderMemberTierView(tier);
}
function memberLogout() { supabaseClient.auth.signOut(); location.reload(); }
function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; }); }

// ======================== ADMIN LOGIC (FIXED SAVE) ========================
async function loadAdminVideos() {
  if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  let { data, error } = await supabaseClient.from("lessons").select("*").order("sort_order");
  if (error) { alert("Admin load error: " + error.message); return; }
  adminVideos = data || [];
  adminSelectedIds.clear();
  adminCurrentPage = 1;
  renderAdminTable();
  updateAdminStats();
}
function renderAdminTable() {
  let filtered = adminVideos.filter(v => {
    if (adminTierFilter !== "all" && v.tier_required !== adminTierFilter) return false;
    if (adminSearchQuery && !(v.title || "").toLowerCase().includes(adminSearchQuery.toLowerCase())) return false;
    return true;
  });
  let totalPages = Math.ceil(filtered.length / adminPerPage);
  if (adminCurrentPage > totalPages) adminCurrentPage = Math.max(1, totalPages);
  let start = (adminCurrentPage - 1) * adminPerPage;
  let paged = filtered.slice(start, start + adminPerPage);
  let tbody = document.getElementById("adminTableBody");
  if (!paged.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No videos</td></tr>'; document.getElementById("adminPagination").innerHTML = ""; return; }
  tbody.innerHTML = paged.map(v => {
    let isSel = adminSelectedIds.has(v.id);
    return `<tr data-id="${v.id}" class="${isSel ? 'selected' : ''}" style="${isSel ? 'background:#1a2a1a' : ''}">
      <td><input type="checkbox" class="admin-video-check" data-id="${v.id}" ${isSel ? 'checked' : ''}></td>
      <td>${v.id}</td>
      <td><input type="text" class="admin-title-input" data-id="${v.id}" value="${escapeHtml(v.title || '')}" style="background:#1f2937; border:1px solid #374151; color:white; padding:6px 10px; border-radius:8px; width:240px;"></td>
      <td><input type="text" class="admin-cat-input" data-id="${v.id}" value="${escapeHtml(v.category || '')}" placeholder="Category" style="background:#1f2937; border:1px solid #374151; color:white; padding:6px 10px; border-radius:8px; width:170px;"></td>
      <td><select class="admin-tier-select" data-id="${v.id}" style="background:#1f2937; color:white; border-radius:20px; padding:6px 10px;"><option value="1" ${v.tier_required===1?'selected':''}>Tier 1</option><option value="2" ${v.tier_required===2?'selected':''}>Tier 2</option><option value="3" ${v.tier_required===3?'selected':''}>Tier 3</option></select></td>
      <td><input type="number" class="admin-sort-input" data-id="${v.id}" value="${v.sort_order || 0}" style="background:#1f2937; border:1px solid #374151; color:white; width:70px; padding:6px; border-radius:8px;"></td>
      <td><button class="save-row-btn" data-id="${v.id}" style="background:#16a34a; border:none; padding:5px 12px; border-radius:20px; color:white; cursor:pointer;">💾 Save</button>
      <button class="delete-row-btn" data-id="${v.id}" style="background:#7f1d1d; border:none; padding:5px 10px; border-radius:20px; color:white; margin-left:6px; cursor:pointer;">🗑️</button></td>
    </tr>`;
  }).join("");
  attachAdminRowEvents();
  renderAdminPagination(filtered.length, totalPages);
  syncAdminHeaderCheck();
  updateAdminSelCount();
}
function attachAdminRowEvents() {
  document.querySelectorAll('.save-row-btn').forEach(btn => {
    btn.onclick = async (e) => { let id = parseInt(btn.getAttribute('data-id')); await adminSaveRow(id); };
  });
  document.querySelectorAll('.delete-row-btn').forEach(btn => {
    btn.onclick = async (e) => { if(confirm("Delete forever?")) { let id = parseInt(btn.getAttribute('data-id')); await adminDeleteRow(id); } };
  });
  document.querySelectorAll('.admin-video-check').forEach(cb => {
    cb.onchange = (e) => { let id = parseInt(cb.getAttribute('data-id')); if(cb.checked) adminSelectedIds.add(id); else adminSelectedIds.delete(id); updateAdminSelCount(); syncAdminHeaderCheck(); };
  });
}
async function adminSaveRow(id) {
  let title = document.querySelector(`.admin-title-input[data-id="${id}"]`)?.value || "";
  let category = document.querySelector(`.admin-cat-input[data-id="${id}"]`)?.value || "";
  let tier = parseInt(document.querySelector(`.admin-tier-select[data-id="${id}"]`)?.value || 1);
  let sort = parseInt(document.querySelector(`.admin-sort-input[data-id="${id}"]`)?.value || 0);
  let { error } = await supabaseClient.from("lessons").update({ title, category, tier_required: tier, sort_order: sort }).eq("id", id);
  if (error) { alert("Save failed: " + error.message); return; }
  let idx = adminVideos.findIndex(v => v.id === id);
  if (idx !== -1) { adminVideos[idx].title = title; adminVideos[idx].category = category; adminVideos[idx].tier_required = tier; adminVideos[idx].sort_order = sort; }
  // Also update member array if needed
  let memberIdx = allVideos.findIndex(v => v.id === id);
  if (memberIdx !== -1) { allVideos[memberIdx].title = title; allVideos[memberIdx].category = category; allVideos[memberIdx].tier_required = tier; allVideos[memberIdx].sort_order = sort; }
  updateAdminStats();
  renderAdminTable();
  if (document.getElementById("dashboardView").style.display === "block") updateStats();
  toastAdmin("✅ Saved successfully");
}
async function adminDeleteRow(id) {
  let { error } = await supabaseClient.from("lessons").delete().eq("id", id);
  if (error) { alert("Delete failed: " + error.message); return; }
  adminVideos = adminVideos.filter(v => v.id !== id);
  if (allVideos) allVideos = allVideos.filter(v => v.id !== id);
  adminSelectedIds.delete(id);
  updateAdminStats();
  renderAdminTable();
  if (document.getElementById("dashboardView").style.display === "block") updateStats();
  toastAdmin("🗑️ Deleted");
}
async function bulkUpdateAdmin() {
  if (adminSelectedIds.size === 0) { toastAdmin("Select videos first", "info"); return; }
  let newTier = document.getElementById("bulkTierSelect").value;
  let newCat = document.getElementById("bulkCatInput").value.trim();
  if (!newTier && !newCat) { toastAdmin("Choose tier or category", "info"); return; }
  let updates = {};
  if (newTier) updates.tier_required = parseInt(newTier);
  if (newCat) updates.category = newCat;
  for (let id of adminSelectedIds) {
    await supabaseClient.from("lessons").update(updates).eq("id", id);
    let v = adminVideos.find(v => v.id === id);
    if (v) { if (newTier) v.tier_required = parseInt(newTier); if (newCat) v.category = newCat; }
    let mv = allVideos?.find(v => v.id === id);
    if (mv) { if (newTier) mv.tier_required = parseInt(newTier); if (newCat) mv.category = newCat; }
  }
  adminSelectedIds.clear();
  renderAdminTable();
  updateAdminStats();
  if (document.getElementById("dashboardView").style.display === "block") updateStats();
  toastAdmin("Bulk update done");
}
async function bulkDeleteAdmin() {
  if (adminSelectedIds.size === 0) return toastAdmin("No selection");
  if (!confirm(`Delete ${adminSelectedIds.size} videos permanently?`)) return;
  for (let id of adminSelectedIds) { await supabaseClient.from("lessons").delete().eq("id", id); }
  adminVideos = adminVideos.filter(v => !adminSelectedIds.has(v.id));
  if (allVideos) allVideos = allVideos.filter(v => !adminSelectedIds.has(v.id));
  adminSelectedIds.clear();
  renderAdminTable();
  updateAdminStats();
  if (document.getElementById("dashboardView").style.display === "block") updateStats();
  toastAdmin("Deleted selected");
}
function updateAdminStats() { 
  let total = adminVideos.length;
  document.getElementById("s-total") ? document.getElementById("s-total").innerText = total : null;
}
function setAdminTier(tier, el) { adminTierFilter = tier; adminCurrentPage = 1; document.querySelectorAll('#adminPanel .tab').forEach(t => t.classList.remove('active')); el.classList.add('active'); renderAdminTable(); }
function clearAdminSelection() { adminSelectedIds.clear(); renderAdminTable(); }
function syncAdminHeaderCheck() { let allBoxes = document.querySelectorAll('.admin-video-check'); let allChecked = allBoxes.length > 0 && [...allBoxes].every(cb => cb.checked); let header = document.getElementById("adminHeaderCheck"); if (header) header.checked = allChecked; let pageSelect = document.getElementById("adminSelectAllPage"); if (pageSelect) pageSelect.checked = allChecked; }
function updateAdminSelCount() { document.getElementById("adminSelCount").innerText = adminSelectedIds.size + " selected"; }
function renderAdminPagination(totalItems, totalPages) { let pgDiv = document.getElementById("adminPagination"); if (totalPages <= 1) { pgDiv.innerHTML = ""; return; } let html = `<button class="page-btn" onclick="adminGoPage(1)">«</button><button class="page-btn" onclick="adminGoPage(${adminCurrentPage-1})" ${adminCurrentPage===1?'disabled':''}>‹</button>`; for (let i=Math.max(1,adminCurrentPage-2); i<=Math.min(totalPages,adminCurrentPage+2); i++) html += `<button class="page-btn ${i===adminCurrentPage?'active':''}" onclick="adminGoPage(${i})">${i}</button>`; html += `<button class="page-btn" onclick="adminGoPage(${adminCurrentPage+1})" ${adminCurrentPage===totalPages?'disabled':''}>›</button><button class="page-btn" onclick="adminGoPage(${totalPages})">»</button>`; pgDiv.innerHTML = html; }
function adminGoPage(p) { adminCurrentPage = p; renderAdminTable(); }
function toastAdmin(msg, type="ok") { let d = document.createElement("div"); d.className = `toast toast-${type}`; d.innerText = msg; d.style.position="fixed"; d.style.bottom="20px"; d.style.right="20px"; d.style.background="#16a34a"; d.style.color="white"; d.style.padding="12px 20px"; d.style.borderRadius="40px"; d.style.zIndex="9999"; document.body.appendChild(d); setTimeout(()=>d.remove(), 2500); }

// Admin UI event binding
document.getElementById("adminSearch")?.addEventListener("input", (e) => { adminSearchQuery = e.target.value; adminCurrentPage = 1; renderAdminTable(); });
document.getElementById("adminPerPage")?.addEventListener("change", (e) => { adminPerPage = parseInt(e.target.value); adminCurrentPage = 1; renderAdminTable(); });
document.getElementById("adminSelectAllPage")?.addEventListener("change", (e) => { let ch = e.target.checked; document.querySelectorAll('.admin-video-check').forEach(cb => { cb.checked = ch; let id = parseInt(cb.getAttribute('data-id')); if(ch) adminSelectedIds.add(id); else adminSelectedIds.delete(id); }); renderAdminTable(); });
document.getElementById("adminHeaderCheck")?.addEventListener("change", (e) => { let ch = e.target.checked; document.querySelectorAll('.admin-video-check').forEach(cb => { cb.checked = ch; let id = parseInt(cb.getAttribute('data-id')); if(ch) adminSelectedIds.add(id); else adminSelectedIds.delete(id); }); renderAdminTable(); });

// admin auth and view switch
function showAdminLogin() { let pwd = prompt("Admin Password:"); if (pwd === ADMIN_PASS) { document.getElementById("loginView").style.display = "none"; document.getElementById("dashboardView").style.display = "none"; document.getElementById("adminPanel").style.display = "block"; if (!supabaseClient) supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); loadAdminVideos(); } else alert("Wrong password"); }
function hideAdminShowMember() { document.getElementById("adminPanel").style.display = "none"; document.getElementById("loginView").style.display = "flex"; document.getElementById("dashboardView").style.display = "none"; location.reload(); }
function adminLogout() { location.reload(); }
document.getElementById("gotoAdminBtn")?.addEventListener("click", showAdminLogin);

// INITIALIZE: supabase and session check
window.addEventListener("load", () => {
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  loadLocalData();
  supabaseClient.auth.getUser().then(({ data: { user } }) => {
    if (user) {
      supabaseClient.from("profiles").select("membership_tier").eq("email", user.email).maybeSingle().then(({ data: p }) => { currentUserTier = Math.min(p?.membership_tier || 1, 3); document.getElementById("userTierBadge").innerText = currentUserTier >=3 ? "Full Access" : `Tier ${currentUserTier}`; loadMemberVideos(); }).catch(() => loadMemberVideos());
      document.getElementById("loginView").style.display = "none";
      document.getElementById("dashboardView").style.display = "block";
    }
  });
  document.getElementById("loginBtn").addEventListener("click", memberLogin);
  document.getElementById("loginPassword").addEventListener("keydown", (e) => { if(e.key === "Enter") memberLogin(); });
  document.getElementById("tabContainer")?.addEventListener("click", (e) => { if(e.target.dataset.tab) switchMemberTab(e.target.dataset.tab); });
});
</script>
</body>
