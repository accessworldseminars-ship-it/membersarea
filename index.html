<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccessWorld Members Area</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#1A2744;min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:16px;padding:30px}
.login-box{max-width:350px;margin:60px auto;text-align:center}
.login-box h1{color:#1A2744;margin-bottom:8px}
.login-box p{color:#666;margin-bottom:24px}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
button{background:#1D9E75;color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;width:100%;font-size:16px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logout-btn{background:#dc3545;width:auto;padding:8px 20px}
.two-col{display:flex;gap:24px}
.left-menu{width:260px;background:#f8f9fa;border-radius:12px;padding:16px}
.menu-item{padding:12px;margin-bottom:6px;border-radius:8px;cursor:pointer;background:#f0f0f0}
.menu-item.active{background:#1D9E75;color:#fff}
.right-col{flex:1}
.vid-item{padding:14px;margin-bottom:8px;border:1px solid #eee;border-radius:8px;cursor:pointer}
.vid-item:hover{background:#f0fdf9}
.vid-title{font-weight:600}
.vid-desc{color:#888;font-size:13px;margin-top:4px}
.player-box{display:none;margin-top:20px;padding:20px;background:#f8f9fa;border-radius:12px}
.player-box.on{display:block}
.player-box iframe{width:100%;height:400px;border:none;border-radius:8px}
.error{color:red;margin-top:10px}
</style>
</head>
<body>
<div class="container">

<div id="login-section">
  <div class="login-box">
    <h1>AccessWorld Seminars</h1>
    <p>Member Portal</p>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Sign In</button>
    <div id="login-error" class="error"></div>
  </div>
</div>

<div id="dashboard" style="display:none">
  <div class="header">
    <h1>AccessWorld Library</h1>
    <button class="logout-btn" onclick="logout()">Sign Out</button>
  </div>
  <div class="two-col">
    <div class="left-menu">
      <h4>Categories</h4>
      <div id="cat-menu"></div>
    </div>
    <div class="right-col">
      <h3 id="cat-title">Select a category</h3>
      <div id="vid-list"></div>
      <div id="player-box" class="player-box">
        <h3 id="p-title"></h3>
        <p id="p-desc"></p>
        <iframe id="p-iframe" src=""></iframe>
        <button onclick="closePlayer()" style="margin-top:10px;width:auto;padding:8px 16px">Close</button>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://zwwodopezadqjazhajmx.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg";
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let lessons = [];
let currentUserTier = 1;

const CATS = [
  {id:"unlock", name:"Unlock Your Incredible Self", kw:["unlock","incredible"]},
  {id:"coaching", name:"Group Coaching", kw:["coach","group"]},
  {id:"emotional", name:"Emotional Clearing", kw:["emotional","clearing","gift","grey"]},
  {id:"morning", name:"Morning Routine", kw:["morning","routine"]},
  {id:"strategic", name:"Strategic Visioning", kw:["strategic","visioning"]},
  {id:"nlp", name:"NLP Masterclass", kw:["nlp"]},
  {id:"intro", name:"Free Introductions", kw:["free","intro"]},
  {id:"coachingcert", name:"Coaching Certification", kw:["coaching lesson","coach yourself","world class coach"]},
  {id:"meditation", name:"Meditations", kw:["meditation","breath","gift","womb","freedom"]},
];

function catFor(title){
  const t = title.toLowerCase();
  for(const c of CATS){
    if(c.kw.some(k => t.includes(k))) return c.name;
  }
  return "Other";
}

async function login(){
  const email = document.getElementById("email").value;
  const pw = document.getElementById("password").value;
  const errorDiv = document.getElementById("login-error");
  
  const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
  if(error){ errorDiv.innerText = error.message; return; }
  
  const {data: profile} = await sb.from("profiles").select("membership_tier").eq("email", email).single();
  currentUserTier = profile?.membership_tier || 1;
  
  await loadContent();
}

async function loadContent(){
  // Load ALL lessons - NO filter
  const {data, error} = await sb.from("lessons").select("*").order("sort_order");
  if(error){ console.error(error); return; }
  lessons = data||[];
  
  console.log("Total lessons:", lessons.length);
  console.log("Tier 1:", lessons.filter(l => l.tier_required === 1).length);
  console.log("Tier 2:", lessons.filter(l => l.tier_required === 2).length);
  console.log("Tier 3:", lessons.filter(l => l.tier_required === 3).length);
  
  document.getElementById("login-section").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  buildMenu();
}

function buildMenu(){
  const menu = document.getElementById("cat-menu");
  let html = "";
  for(const c of CATS){
    const vids = lessons.filter(l => catFor(l.title) === c.name && l.tier_required <= currentUserTier);
    if(!vids.length) continue;
    html += `<div class="menu-item" onclick="showCategory('${c.name}')">${c.name} (${vids.length})</div>`;
  }
  menu.innerHTML = html;
}

function showCategory(catName){
  document.querySelectorAll(".menu-item").forEach(m => m.classList.remove("active"));
  event.target.classList.add("active");
  
  const vids = lessons.filter(l => catFor(l.title) === catName && l.tier_required <= currentUserTier);
  document.getElementById("cat-title").innerText = catName;
  
  let html = "";
  vids.forEach(v => {
    html += `<div class="vid-item" onclick="playVideo(${v.id})">
      <div class="vid-title">${v.title}</div>
      <div class="vid-desc">${v.description ? v.description.substring(0,80) : "Click to watch"}</div>
    </div>`;
  });
  document.getElementById("vid-list").innerHTML = html;
}

function playVideo(id){
  const v = lessons.find(l => l.id === id);
  if(!v) return;
  
  if(v.tier_required > currentUserTier){
    alert(`This content requires Tier ${v.tier_required}. Please upgrade.`);
    return;
  }
  
  document.getElementById("p-title").innerText = v.title;
  document.getElementById("p-desc").innerText = v.description || "";
  const iframe = document.getElementById("p-iframe");
  iframe.src = "";
  setTimeout(() => { iframe.src = v.google_drive_embed_url || ""; }, 100);
  
  document.getElementById("player-box").classList.add("on");
}

function closePlayer(){
  document.getElementById("player-box").classList.remove("on");
  document.getElementById("p-iframe").src = "";
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

window.onload = async () => {
  const {data: {user}} = await sb.auth.getUser();
  if(user) await loadContent();
};
</script>
</body>
</html>
