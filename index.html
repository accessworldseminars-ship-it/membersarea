<script>
window.addEventListener('load', function() {
  // ----- SUPABASE SETUP -----

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allVideos = [];
  let watchedMap = {};
  let userNotes = [];
  let currentUserTier = 1;
  let activeCategoryId = null;
  let activeVideoId = null;

  // ----- CATEGORIES (unchanged) -----

    { id: "adv_sem",   name: "🎪 Advanced Seminars",             tier: 3, kw: ["emotional mastery seminar", "holistic health webinar", "day 1", "day 2"] },
    { id: "meditation",name: "🧘 Meditations & Audio",           tier: 1, kw: ["meditation", "the gift", "guided breath"] }
  ];

  function getCategoryForVideo(video) {
    const title = (video.title || "").toLowerCase();
    for (let cat of CATEGORIES) {
      if (cat.kw.some(k => title.includes(k.toLowerCase()))) return cat;
    }
    return { id: "other", name: "📁 Other Content", tier: video.tier_required || 1 };
  }

  function loadLocal() {
    try {
      if (localStorage.getItem("aw_watched")) watchedMap = JSON.parse(localStorage.getItem("aw_watched"));
      if (localStorage.getItem("aw_notes"))   userNotes  = JSON.parse(localStorage.getItem("aw_notes"));
    } catch(e) { console.warn("localStorage parse error", e); }
  }
  function saveWatched() { localStorage.setItem("aw_watched", JSON.stringify(watchedMap)); }
  function saveNotes()   { localStorage.setItem("aw_notes", JSON.stringify(userNotes)); }

  function escapeHtml(text) {
    return text ? text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]) : '';
  }

  // ----- VIDEO EMBED CONVERSION (FIX) -----
  function getEmbedUrl(rawUrl) {
    if (!rawUrl) return "";
    if (rawUrl.includes("drive.google.com")) return rawUrl;
    if (rawUrl.includes("youtu.be") || rawUrl.includes("youtube.com")) {
      const match = rawUrl.match(/(?:youtu\.be\/|youtube.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
      if (match) return `https://www.youtube.com/embed/${match[1]}`;
    }
    return rawUrl;
  }

  // ----- PLAY VIDEO -----
  function playVideo(videoId) {
    const video = allVideos.find(v => v.id === videoId);
    if (!video) return;
    activeVideoId = videoId;
    const rawUrl = video.video_url || video.google_drive_embed_url || "";
    const embedUrl = getEmbedUrl(rawUrl);
    const iframe = document.getElementById("videoPlayerIframe");
    if (iframe) {
      iframe.src = embedUrl;
    }
    // Update player UI
    const playerPanel = document.getElementById("playerPanel");
    if (playerPanel) {
      document.getElementById("playerTitle").innerText = video.title || "Untitled";
      document.getElementById("playerDesc").innerText = video.description || "No description available.";
      const isWatched = !!watchedMap[video.id];
      const watchBtn = document.getElementById("watchToggleBtn");
      watchBtn.innerText = isWatched ? "✓ Watched" : "Mark as watched";
      watchBtn.onclick = () => toggleWatched(video.id);
      playerPanel.classList.add("show");
    }
    // Highlight active video in list
    document.querySelectorAll('.video-card').forEach(card => {
      if (parseInt(card.getAttribute('data-id')) === videoId) {
        card.classList.add('active-video');
      } else {
        card.classList.remove('active-video');
      }
    });
  }

  function toggleWatched(videoId) {
    if (watchedMap[videoId]) {
      delete watchedMap[videoId];
    } else {
      watchedMap[videoId] = Date.now();
    }
    saveWatched();
    updateStatistics();
    // Refresh current tier view to update watched icons & stats
    renderTierView(currentTierView);
    // If player is open, update the button state
    if (activeVideoId === videoId) {
      const watchBtn = document.getElementById("watchToggleBtn");
      if (watchBtn) watchBtn.innerText = watchedMap[videoId] ? "✓ Watched" : "Mark as watched";
    }
  }

  // ----- LOGIN -----
  async function handleLogin() {
    const btn    = document.getElementById("loginBtn");
    const errDiv = document.getElementById("loginErrorMsg");
    const email  = document.getElementById("loginEmail").value.trim();
    const pwd    = document.getElementById("loginPassword").value;
    errDiv.innerText = "";
    if (!email || !pwd) {
      errDiv.innerText = "Please enter your email and password.";
      return;
    }
    btn.disabled    = true;
    btn.innerText   = "Signing in…";
    try {
      const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
      if (error) {
        errDiv.innerText = error.message;
        btn.disabled  = false;
        btn.innerText = "Sign In →";
        return;
      }
      let userTier = 1;
      try {
        const { data: prof } = await supabase
          .from("profiles")
          .select("membership_tier")
          .eq("email", email)
          .maybeSingle();
        userTier = prof?.membership_tier || 1;

      currentUserTier = Math.min(userTier, 3);
      document.getElementById("userTierBadge").innerText = currentUserTier >= 3 ? "Full Access" : `Tier ${currentUserTier}`;
      await loadVideosAndStart();
    } catch(e) {
      errDiv.innerText = "Unexpected error: " + e.message;
      btn.disabled  = false;
      btn.innerText = "Sign In →";
    }
  }

  async function loadVideosAndStart() {
    const { data, error } = await supabase.from("lessons").select("*").order("sort_order", { ascending: true });
    if (error) {
      alert("Failed to load library: " + error.message);
      return;
    }
    allVideos = data || [];
    document.getElementById("loginView").style.display    = "none";
    document.getElementById("dashboardView").style.display = "block";
    updateStatistics();
    switchTab("tier1");
  }

  function logout() {
    supabase.auth.signOut();
    location.reload();
  }

  function updateStatistics() {
    const accessible = allVideos.filter(v => (v.tier_required || 1) <= currentUserTier);
    document.getElementById("totalVideosStat").innerText = accessible.length;
    document.getElementById("watchedStat").innerText     = Object.keys(watchedMap).length;
    document.getElementById("notesCountStat").innerText  = userNotes.length;
  }

  // ----- RENDER TIER VIEW WITH PLAYER -----
  function renderTierView(tierNum) {
    currentTierView = tierNum;
    if (tierNum > currentUserTier) {
      document.getElementById("dynamicContent").innerHTML =
        `<div style="text-align:center;padding:80px 20px;background:#F9FAFE;border-radius:2rem;">
          <h2>🔒 Tier ${tierNum} Locked</h2>
          <p style="margin-top:12px;color:#62748c;">Upgrade your membership to unlock this content.</p>
        </div>`;
      return;
    }

    const tierVideos = allVideos.filter(v => (v.tier_required || 1) === tierNum);
    const groups = {};
    tierVideos.forEach(v => {
      const cat = getCategoryForVideo(v);
      if (!groups[cat.id]) groups[cat.id] = { ...cat, videos: [] };
      groups[cat.id].videos.push(v);
    });

    let cats = Object.values(groups);
    if (!activeCategoryId || !groups[activeCategoryId]) activeCategoryId = cats[0]?.id;
    const currentCat = groups[activeCategoryId];

    let html = `<div class="two-columns">`;
    html += `<div class="sidebar"><h4 style="margin-bottom:12px;color:#1A2744;">Categories</h4>`;
    cats.forEach(cat => {
      const isActive = activeCategoryId === cat.id;
      html += `<div class="category-item ${isActive ? 'active' : ''}" data-id="${cat.id}">
        ${cat.name} <span class="cat-count">${cat.videos.length}</span>
      </div>`;
    });
    html += `</div><div class="main-panel">`;

    if (currentCat) {
      html += `<div class="category-title">${currentCat.name}</div>`;
      html += `<p style="color:#62748c;font-size:13px;margin-bottom:14px;">${currentCat.videos.length} video${currentCat.videos.length !== 1 ? 's' : ''}</p>`;
      html += `<div class="video-list" id="videoList">`;
      currentCat.videos.forEach(v => {
        const isWatched = !!watchedMap[v.id];
        html += `<div class="video-card ${activeVideoId === v.id ? 'active-video' : ''}" data-id="${v.id}">
          <div><strong>${escapeHtml(v.title)}</strong></div>
          <div style="color:#1D9E75">${isWatched ? '✓' : '▶'}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<p style="color:#62748c;padding:40px 0;text-align:center;">No videos in this category yet.</p>`;
    }

    // Add player panel (hidden initially)
    html += `
      <div id="playerPanel" class="player-panel">
        <h3 id="playerTitle" style="margin-bottom:8px;">Video Title</h3>
        <div id="playerDesc" style="color:#555; margin-bottom:12px; font-size:14px;"></div>
        <iframe id="videoPlayerIframe" src="" allowfullscreen></iframe>
        <div class="player-actions">
          <button id="watchToggleBtn" class="btn btn-gold">Mark as watched</button>
          <button class="btn btn-outline-gold" onclick="document.getElementById('playerPanel').classList.remove('show')">Close</button>
          <span id="watchedStatusLabel" class="watched-badge"></span>
        </div>
      </div>
    `;
    html += `</div></div>`;
    document.getElementById("dynamicContent").innerHTML = html;

    // Attach category click handlers
    document.querySelectorAll('.category-item').forEach(el => {
      el.addEventListener('click', () => {
        activeCategoryId = el.getAttribute('data-id');
        activeVideoId = null;
        renderTierView(tierNum);
      });
    });

    // Attach video click handlers
    document.querySelectorAll('.video-card').forEach(el => {
      el.addEventListener('click', (e) => {
        const vidId = parseInt(el.getAttribute('data-id'));
        playVideo(vidId);
      });
    });
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    activeCategoryId = null;
    if (tab === "notes") {
      // Quick notes placeholder – you can expand later
      document.getElementById("dynamicContent").innerHTML =
        `<div style="padding:40px;text-align:center;color:#62748c;">
           <h3>📝 My Notes</h3>
           <p>Notes feature coming soon. Your watched videos are saved locally.</p>
         </div>`;
    } else {
      const tierNum = parseInt(tab.replace('tier', ''));
      renderTierView(tierNum);
    }
  }

  // ----- EVENT LISTENERS -----

          currentUserTier = Math.min(p?.membership_tier || 1, 3);
          document.getElementById("userTierBadge").innerText = currentUserTier >= 3 ? "Full Access" : `Tier ${currentUserTier}`;
          loadVideosAndStart();
