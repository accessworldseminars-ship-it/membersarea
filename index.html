<script>
// ----------------------------- SUPABASE CONFIG ---------------------------------

const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg";   // <-- REPLACE WITH YOUR REAL ANON KEY
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ----------------------------- GLOBAL STATE ------------------------------------
let allLessons = [];          // all videos from supabase
let watchedMap = {};          // { videoId: true }
let userNotes = [];           // [{ id, title, text, updatedAt }]
let currentUserTier = 1;      // max tier accessible (1,2,3)
let activeTab = "1";          // "1", "2", "3", "notes"
let activeCategoryId = null;
let activeVideoId = null;
let currentTierLessons = [];   // filtered by tier (no meditations/bonus duplicated logic)

// ----------------------------- CATEGORY MASTER ---------------------------------
const CATEGORIES = [
  { id: "unlock", name: "Unlock Your Incredible Self", icon: "🌟", tier: 1, keywords: ["unlock your incredible", "artistry explained", "listen to the attendees", "december 2024"] },
  { id: "morning", name: "Morning Routine", icon: "🌅", tier: 1, keywords: ["morning routine"] },
  { id: "group_early", name: "Group Coaching (2022–2023)", icon: "👥", tier: 1, keywords: ["group coaching - aug 2022", "group coaching - jun 2022", "group coaching - oct 2023", "goal setting", "jan 2024", "apr 2024"] },
  { id: "emotional", name: "Emotional Clearing", icon: "💚", tier: 1, keywords: ["emotional clearing", "gift process", "yelling therapy", "ball and fire", "ultimate freedom", "womb of eternity"] },
  { id: "nlp_basics", name: "NLP Basics", icon: "🧠", tier: 1, keywords: ["nlp basics", "take full control of your", "confidence to succeed", "strategic visioning part"] },
  { id: "health1", name: "Health & Healing", icon: "🏥", tier: 1, keywords: ["acid alkaline", "health & healing"] },
  
  { id: "free_intro", name: "Free Introductions", icon: "🎓", tier: 2, keywords: ["free introduction", "free intro", "nlp for beginners", "money mindset", "incantations", "feeling stuck"] },
  { id: "nlp_state", name: "NLP State & Foundation", icon: "🧠", tier: 2, keywords: ["nlp state elicitation", "nlp foundation principles"] },
  { id: "wcc", name: "World Class Coach Training", icon: "📜", tier: 2, keywords: ["coaching lesson", "how to become a world class coach", "learning to coach yourself"] },
  
  { id: "nlp_master", name: "NLP Masterclass", icon: "🧠", tier: 3, keywords: ["nlp - nlp", "unlock the power of stories", "arcing energy", "collapse anchors", "incantations", "grey room", "self image"] },
  { id: "gc2024", name: "Group Coaching 2024", icon: "👥", tier: 3, keywords: ["group coaching 2024", "020224", "080724", "19012024", "090824", "2024"] },
  { id: "gc2025", name: "Group Coaching 2025", icon: "👥", tier: 3, keywords: ["group coaching 2025", "010425", "140225", "150325", "200225", "211125", "2025"] },
  { id: "gc2026", name: "Group Coaching 2026", icon: "👥", tier: 3, keywords: ["group coaching 2026", "020126", "090126", "230126", "190226", "2026"] },
  { id: "adv_sem", name: "Advanced Seminars (NSR / Life Skills)", icon: "🎪", tier: 3, keywords: ["emotional mastery seminar", "holistic health webinar", "life skills", "nsr", "nervous system reprogramming"] },
  { id: "meditation_shared", name: "🧘 Meditations & Audio", icon: "🧘", tier: 0, keywords: ["meditation", "the gift", "guided breath", "dancing with fear", "ultimate freedom technique", "strategic visioning (audio)", "excitement meditation", "blue hat"] },
];

// helper: match category for a lesson (respects bonus/med logic)
function getCategoryForLesson(lesson, isBonus = false, isMed = false) {
  if (isBonus) return CATEGORIES.find(c => c.id === "meditation_shared") ? null : null; // bonus not in these cats yet
  if (isMed) return CATEGORIES.find(c => c.id === "meditation_shared");
  const titleLower = (lesson.title || "").toLowerCase();
  for (let cat of CATEGORIES) {
    if (cat.tier !== lesson.tier_required && cat.tier !== 0) continue;
    if (cat.keywords.some(kw => titleLower.includes(kw))) return cat;
  }
  return null;
}

// local storage
function loadLocalData() {
  try {
    const w = localStorage.getItem("aw_watched_v2");
    if (w) watchedMap = JSON.parse(w);
    const n = localStorage.getItem("aw_notes_v2");
    if (n) userNotes = JSON.parse(n);
  } catch(e) {}
}
function persistWatched() { localStorage.setItem("aw_watched_v2", JSON.stringify(watchedMap)); }
function persistNotes() { localStorage.setItem("aw_notes_v2", JSON.stringify(userNotes)); }

// auth & bootstrap
async function performLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const pwd = document.getElementById("loginPassword").value;
  const errDiv = document.getElementById("loginErrorMsg");
  errDiv.innerText = "";
  const { data, error } = await supabase.auth.signInWithPassword({ email, password: pwd });
  if (error) { errDiv.innerText = error.message; return false; }
  // get membership tier from profiles
  let membership = 1;
  try {
    const { data: prof } = await supabase.from("profiles").select("membership_tier").eq("email", email).single();
    membership = prof?.membership_tier || 1;
  } catch(e) { membership = 1; }
  currentUserTier = Math.min(membership, 3);
  return true;
}

async function loadVideos() {
  const { data, error } = await supabase.from("lessons").select("*").order("sort_order", { ascending: true });
  if (error) { console.error(error); return []; }
  return data || [];
}

// dynamic rendering
function updateStats() {
  const totalAccessible = allLessons.filter(l => l.tier_required <= currentUserTier).length;
  const watchedCount = allLessons.filter(l => l.tier_required <= currentUserTier && watchedMap[l.id]).length;
  const pct = totalAccessible ? Math.round((watchedCount / totalAccessible) * 100) : 0;
  document.getElementById("totalVideosStat").innerText = totalAccessible;
  document.getElementById("watchedStat").innerText = watchedCount;
  document.getElementById("notesStat").innerText = userNotes.length;
  document.getElementById("progressPercent").innerText = pct + "%";
}

function renderNotesView() {
  const container = document.getElementById("dynamicContent");
  let notesHtml = `<div style="max-width:780px; margin:0 auto;">
    <button class="btn btn-outline-gold" id="backToLibraryNotesBtn" style="margin-bottom:24px;">← Back to Library</button>
    <div style="background:#F9FAFE; border-radius:28px; padding:28px;">
      <h3 style="font-size:22px; font-weight:700;">📝 My Notes</h3>
      <div class="note-form" style="margin:24px 0;">
        <input type="text" id="newNoteTitle" placeholder="Note title (e.g., Emotional Clearing insight)" style="width:100%; padding:14px; border-radius:20px; border:1px solid #e2e8f0; margin-bottom:12px;">
        <textarea id="newNoteBody" rows="3" placeholder="Write your reflection or key takeaways..."></textarea>
        <button class="btn btn-primary" id="saveGlobalNoteBtn" style="margin-top:12px; width:auto; padding:10px 24px;">Save Note</button>
      </div>
      <div id="notesListContainer">`;
  if (userNotes.length === 0) notesHtml += `<div class="empty-state" style="text-align:center; color:#7a89a4;">✨ No notes yet. Take notes while watching videos.</div>`;
  else {
    userNotes.slice().reverse().forEach(n => {
      notesHtml += `
        <div style="background:white; border-radius:20px; padding:18px; margin-bottom:14px; border:1px solid #eef2f6;">
          <div style="display:flex; justify-content:space-between;"><strong>${escapeHtml(n.title)}</strong><span style="font-size:11px; color:#aaa;">${new Date(n.updatedAt).toLocaleDateString()}</span></div>
          <div style="margin-top:8px; white-space:pre-wrap;">${escapeHtml(n.text)}</div>
          <button class="delete-note-btn" data-id="${n.id}" style="margin-top:12px; background:none; border:1px solid #e0e0e0; border-radius:30px; padding:5px 14px; font-size:12px; cursor:pointer;">🗑 Delete</button>
        </div>`;
    });
  }
  notesHtml += `</div></div></div>`;
  container.innerHTML = notesHtml;
  document.getElementById("backToLibraryNotesBtn")?.addEventListener("click", () => switchTab("1"));
  document.getElementById("saveGlobalNoteBtn")?.addEventListener("click", () => {
    const title = document.getElementById("newNoteTitle").value.trim();
    const text = document.getElementById("newNoteBody").value.trim();
    if (!text) return;
    userNotes.push({ id: Date.now(), title: title || "Quick note", text, updatedAt: new Date().toISOString() });
    persistNotes();
    renderNotesView();
    updateStats();
  });
  document.querySelectorAll(".delete-note-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const noteId = parseInt(btn.getAttribute("data-id"));
      userNotes = userNotes.filter(n => n.id !== noteId);
      persistNotes();
      renderNotesView();
      updateStats();
    });
  });
}

function getCategoryLessons(tierNum, categoryId) {
  const cat = CATEGORIES.find(c => c.id === categoryId);
  if (!cat) return [];
  if (categoryId === "meditation_shared") {
    return allLessons.filter(l => (l.title || "").toLowerCase().includes("meditation") || (l.title || "").toLowerCase().includes("the gift") || (l.title || "").toLowerCase().includes("guided breath") || (l.title || "").toLowerCase().includes("blue hat"));
  }
  return allLessons.filter(l => l.tier_required === tierNum && getCategoryForLesson(l, false, false)?.id === categoryId);
}

function renderTierView(tierNumber) {
  if (tierNumber > currentUserTier) {
    document.getElementById("dynamicContent").innerHTML = `<div class="locked-tier"><span style="font-size:56px;">🔒</span><h2>Tier ${tierNumber} is locked</h2><p>Upgrade your membership to access.</p><button class="btn btn-primary" onclick="alert('Contact support@accessworldseminars.com for upgrade')">Request Upgrade</button></div>`;
    return;
  }
  const availableCats = CATEGORIES.filter(c => c.tier === tierNumber);
  if (!activeCategoryId || !availableCats.find(c => c.id === activeCategoryId)) activeCategoryId = availableCats[0]?.id || null;
  const currentCatObj = CATEGORIES.find(c => c.id === activeCategoryId);
  const videosInCat = activeCategoryId ? getCategoryLessons(tierNumber, activeCategoryId) : [];
  const watchedInCat = videosInCat.filter(v => watchedMap[v.id]).length;
  const progressPercent = videosInCat.length ? (watchedInCat / videosInCat.length) * 100 : 0;
  
  let leftMenuHtml = `<div class="category-sidebar"><div style="font-weight:700; margin-bottom:12px;">📂 Categories</div>`;
  availableCats.forEach(cat => {
    const count = getCategoryLessons(tierNumber, cat.id).length;
    leftMenuHtml += `<div class="category-item ${activeCategoryId === cat.id ? 'active' : ''}" data-cat="${cat.id}">
      <div class="cat-left"><span>${cat.icon}</span> ${cat.name}</div>
      <div class="cat-count">${count}</div>
    </div>`;
  });
  leftMenuHtml += `</div>`;
  
  let rightHtml = `<div class="right-area">
    <div class="category-title">${currentCatObj?.icon || "📁"} ${currentCatObj?.name || "Library"}</div>
    <div class="category-desc">${videosInCat.length} session${videosInCat.length !== 1 ? 's' : ''} · ${watchedInCat} completed</div>
    <div class="progress-section"><div class="progress-text"><span>Category progress</span><span>${Math.round(progressPercent)}%</span></div><div class="progress-bar-bg"><div class="progress-fill" style="width:${progressPercent}%"></div></div></div>
    <div class="video-list" id="videoListContainer"></div>
    <div id="playerPanelContainer" class="player-panel"></div>
  </div>`;
  
  document.getElementById("dynamicContent").innerHTML = `<div class="two-columns">${leftMenuHtml}${rightHtml}</div>`;
  
  // attach category click
  document.querySelectorAll(".category-item").forEach(el => {
    el.addEventListener("click", () => {
      activeCategoryId = el.getAttribute("data-cat");
      renderTierView(tierNumber);
    });
  });
  
  // render video list
  const vidContainer = document.getElementById("videoListContainer");
  if (videosInCat.length === 0) vidContainer.innerHTML = `<div style="padding:32px; text-align:center;">✨ No videos yet in this category.</div>`;
  else {
    vidContainer.innerHTML = videosInCat.map(v => `
      <div class="video-card ${activeVideoId === v.id ? 'active-video' : ''}" data-video-id="${v.id}">
        <div class="video-info"><h4>${escapeHtml(v.title || "Untitled")}</h4><p>${v.description ? v.description.substring(0,70)+"…" : "Click to watch"}</p></div>
        <div class="watch-check">${watchedMap[v.id] ? "✓" : "▶"}</div>
      </div>
    `).join("");
    document.querySelectorAll(".video-card").forEach(card => {
      card.addEventListener("click", (e) => {
        const vidId = parseInt(card.getAttribute("data-video-id"));
        activeVideoId = vidId;
        renderTierView(tierNumber);
        showPlayer(vidId, tierNumber);
      });
    });
  }
  if (activeVideoId) showPlayer(activeVideoId, tierNumber);
}

async function showPlayer(videoId, tierNum) {
  const lesson = allLessons.find(l => l.id === videoId);
  if (!lesson) return;
  const isWatched = !!watchedMap[lesson.id];
  const noteForVideo = userNotes.find(n => n.id === lesson.id);
  const playerDiv = document.getElementById("playerPanelContainer");
  if (!playerDiv) return;
  playerDiv.classList.add("show");
  playerDiv.innerHTML = `
    <div class="player-title">${escapeHtml(lesson.title)}</div>
    <div class="player-desc">${lesson.description ? escapeHtml(lesson.description) : "No description provided."}</div>
    <iframe src="${getEmbedUrl(lesson.google_drive_embed_url || lesson.video_url || "")}" allowfullscreen></iframe>
    <div class="player-actions">
      <button class="btn btn-outline-gold" id="watchToggleBtn">${isWatched ? "✓ Watched" : "Mark as watched"}</button>
      <button class="btn btn-danger" id="closePlayerBtn">Close</button>
    </div>
    <div class="notes-section">
      <label style="font-weight:600;">📝 Personal notes for this session</label>
      <textarea id="videoNoteText" rows="2" placeholder="Write your insights, questions, highlights...">${escapeHtml(noteForVideo?.text || "")}</textarea>
      <div style="display:flex; justify-content:flex-end; margin-top:8px;"><button class="btn btn-primary" id="saveNoteForVideoBtn" style="padding:6px 20px;">Save Note</button><span id="noteSavedMsg" class="note-saved-msg" style="margin-left:12px;">✓ Saved</span></div>
    </div>
  `;
  document.getElementById("watchToggleBtn")?.addEventListener("click", () => {
    if (watchedMap[lesson.id]) delete watchedMap[lesson.id];
    else watchedMap[lesson.id] = true;
    persistWatched();
    updateStats();
    renderTierView(tierNum);
  });
  document.getElementById("closePlayerBtn")?.addEventListener("click", () => {
    activeVideoId = null;
    renderTierView(tierNum);
  });
  document.getElementById("saveNoteForVideoBtn")?.addEventListener("click", () => {
    const textarea = document.getElementById("videoNoteText");
    const newText = textarea.value.trim();
    if (!newText) return;
    const existingIdx = userNotes.findIndex(n => n.id === lesson.id);
    const noteObj = { id: lesson.id, title: lesson.title, text: newText, updatedAt: new Date().toISOString() };
    if (existingIdx !== -1) userNotes[existingIdx] = noteObj;
    else userNotes.push(noteObj);
    persistNotes();
    const msg = document.getElementById("noteSavedMsg");
    if (msg) { msg.style.opacity = "1"; setTimeout(() => msg.style.opacity = "0", 1500); }
    updateStats();
  });
}

function getEmbedUrl(url) {
  if (!url) return "";
  if (url.includes("drive.google.com")) return url;
  if (url.includes("youtu.be") || url.includes("youtube.com")) {
    let vid = url.match(/(?:youtu\.be\/|youtube.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
    return vid ? `https://www.youtube.com/embed/${vid[1]}` : url;
  }
  return url;
}

function switchTab(tabId) {
  activeTab = tabId;
  activeVideoId = null;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  const tabEl = Array.from(document.querySelectorAll(".tab")).find(t => t.getAttribute("data-tier") === tabId || (tabId === "notes" && t.getAttribute("data-notes")));
  if (tabEl) tabEl.classList.add("active");
  if (tabId === "notes") renderNotesView();
  else renderTierView(parseInt(tabId));
}

async function initApp() {
  loadLocalData();
  allLessons = await loadVideos();
  if (!allLessons.length) console.warn("no lessons?");
  document.getElementById("loginContainer").style.display = "none";
  document.getElementById("dashboardApp").style.display = "block";
  document.getElementById("userTierBadge").innerText = `Tier ${currentUserTier} Member`;
  updateStats();
  // attach tab listeners
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => {
      if (tab.getAttribute("data-notes") === "true") switchTab("notes");
      else switchTab(tab.getAttribute("data-tier"));
    });
  });
  switchTab("1");
}

document.getElementById("loginBtn")?.addEventListener("click", async () => {
  const ok = await performLogin();
  if (ok) await initApp();
});
document.getElementById("logoutBtn")?.addEventListener("click", async () => {
  await supabase.auth.signOut();
  location.reload();
});
// auto session check
(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (user) {
    let membership = 1;
    try {
      const { data: prof } = await supabase.from("profiles").select("membership_tier").eq("email", user.email).single();
      membership = prof?.membership_tier || 1;
    } catch(e) {}
    currentUserTier = Math.min(membership, 3);
    await initApp();
  }
})();

function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
</script>
