<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccessWorld Members Area</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#1A2744;min-height:100vh;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 20px 60px rgba(0,0,0,0.3)}
.login-box{max-width:360px;margin:60px auto;text-align:center}
.login-box img{height:64px;margin-bottom:20px}
.login-box h1{color:#1A2744;font-size:26px;margin-bottom:6px}
.login-box p{color:#888;margin-bottom:28px;font-size:15px}
input[type=email],input[type=password]{width:100%;padding:13px 15px;margin:7px 0;border:1.5px solid #ddd;border-radius:9px;font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:#1D9E75}
.err{color:#dc3545;font-size:13px;margin-top:8px;min-height:18px}
.btn{border:none;border-radius:9px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-green{background:#1D9E75;color:#fff;padding:13px 20px;font-size:15px;width:100%;justify-content:center}
.btn-green:hover{background:#178a65}
.btn-red{background:#dc3545;color:#fff;padding:8px 18px;font-size:13px}
.btn-red:hover{background:#c82333}
.btn-gray{background:#e8e8e8;color:#555;padding:9px 16px;font-size:13px}
.btn-gray:hover{background:#ddd}
.btn-gold{background:#C9A84C;color:#fff;padding:9px 18px;font-size:14px}
.btn-gold:hover{background:#b8933f}
.btn-outline{background:none;border:1.5px solid #C9A84C;color:#C9A84C;padding:8px 16px;font-size:13px}
.btn-outline:hover{background:#C9A84C;color:#fff}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;padding-bottom:18px;border-bottom:2px solid #f0f0f0}
.header-left{display:flex;align-items:center;gap:12px}
.header-left img{height:40px}
.header-left h1{font-size:21px;color:#1A2744;font-weight:700}
.header-right{display:flex;align-items:center;gap:10px}
.tier-badge{background:#1D9E75;color:#fff;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:.3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.stat-card{background:#f7f8fa;border-radius:10px;padding:14px;text-align:center;border:1px solid #eee}
.stat-num{font-size:30px;font-weight:800;color:#1A2744}
.stat-lbl{font-size:11px;color:#999;margin-top:3px;text-transform:uppercase;letter-spacing:.4px}
.tab-bar{display:flex;gap:0;margin-bottom:22px;border-bottom:2px solid #eee;overflow-x:auto}
.tab{padding:11px 20px;cursor:pointer;font-size:14px;font-weight:600;color:#aaa;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .2s}
.tab:hover{color:#555}
.tab.active{color:#1A2744;border-bottom-color:#C9A84C}
.two-col{display:flex;gap:22px;min-height:480px}
.left-menu{width:250px;flex-shrink:0;background:#f8f9fa;border-radius:12px;padding:14px;max-height:640px;overflow-y:auto;scrollbar-width:thin}
.left-menu h4{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#aaa;margin-bottom:12px;padding:0 4px}
.menu-item{padding:11px 12px;margin-bottom:5px;border-radius:8px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:space-between;gap:6px}
.menu-item:hover{background:#e8f9f1}
.menu-item.active{background:#1D9E75;color:#fff}
.menu-left{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:#1A2744;flex:1;min-width:0}
.menu-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-count{font-size:11px;color:#bbb;flex-shrink:0}
.w-badge{font-size:10px;background:#C9A84C;color:#fff;padding:1px 6px;border-radius:10px;flex-shrink:0}
.right-col{flex:1;min-width:0}
.cat-header{margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid #eee}
.cat-header h2{font-size:17px;color:#1A2744;font-weight:700}
.cat-header p{font-size:13px;color:#aaa;margin-top:3px}
.vid-item{padding:13px 14px;margin-bottom:7px;border:1.5px solid #eee;border-radius:9px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
.vid-item:hover{background:#f0fdf9;border-color:#1D9E75}
.vid-item.active{background:#e8f9f1;border-left:4px solid #1D9E75;border-color:#1D9E75}
.vid-info{flex:1;min-width:0}
.vid-title{font-weight:600;color:#1A2744;font-size:14px;margin-bottom:3px}
.vid-desc{color:#aaa;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vid-meta{display:flex;align-items:center;gap:8px;flex-shrink:0}
.tick{color:#1D9E75;font-size:17px;font-weight:800}
.play-icon{color:#C9A84C;font-size:20px}
.player-box{margin-top:14px;background:#f8f9fa;border-radius:12px;padding:20px;display:none;border:1px solid #eee}
.player-box.on{display:block}
.player-box h3{color:#1A2744;font-size:16px;font-weight:700;margin-bottom:8px}
.player-desc{color:#555;font-size:13px;line-height:1.65;margin-bottom:14px;max-height:80px;overflow:hidden;transition:max-height .3s}
.player-desc.expanded{max-height:600px}
.desc-toggle{font-size:12px;color:#1D9E75;cursor:pointer;margin-bottom:12px;display:inline-block}
.player-box iframe{width:100%;height:400px;border:none;border-radius:8px;background:#111}
.player-actions{display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap}
.watched-label{font-size:13px;color:#1D9E75;font-weight:600}
.progress-wrap{margin-bottom:18px}
.progress-wrap label{font-size:12px;color:#888;display:flex;justify-content:space-between;margin-bottom:6px}
.progress-bar{background:#eee;border-radius:999px;height:7px;overflow:hidden}
.progress-fill{background:linear-gradient(90deg,#1D9E75,#C9A84C);height:100%;border-radius:999px;transition:width .5s ease}
.locked-box{text-align:center;padding:60px 20px}
.locked-box .lock-icon{font-size:48px;margin-bottom:16px}
.locked-box h2{color:#1A2744;margin-bottom:12px;font-size:22px}
.locked-box p{color:#666;font-size:15px;max-width:500px;margin:0 auto 24px;line-height:1.6}
.notes-wrap{max-width:700px}
.notes-back{margin-bottom:18px}
.note-form{background:#fffdf5;border:1.5px solid #e8ddb0;border-radius:10px;padding:18px;margin-bottom:20px}
.note-form h3{font-size:14px;color:#1A2744;margin-bottom:12px;font-weight:700}
.note-form input[type=text]{width:100%;padding:10px 13px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;margin-bottom:9px;outline:none;transition:border .2s}
.note-form input[type=text]:focus{border-color:#C9A84C}
textarea{width:100%;padding:12px;border:1.5px solid #e0e0e0;border-radius:8px;font-size:14px;line-height:1.6;resize:vertical;min-height:110px;outline:none;font-family:inherit;transition:border .2s}
textarea:focus{border-color:#1D9E75}
.note-card{background:#fff;border:1.5px solid #eeddb0;border-radius:9px;padding:15px;margin-bottom:10px}
.note-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.note-title{font-size:14px;font-weight:700;color:#1A2744}
.note-date{font-size:11px;color:#bbb;white-space:nowrap}
.note-body{font-size:13px;color:#444;line-height:1.6;white-space:pre-wrap}
.note-del{background:none;border:1px solid #eee;color:#ccc;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;margin-top:10px;transition:all .2s}
.note-del:hover{background:#fee;color:#c00;border-color:#fcc}
.empty{text-align:center;color:#bbb;padding:50px 20px;font-size:14px}
.meditation-icon{color:#7c5cbf}
.meditation-tab.active{color:#7c5cbf;border-bottom-color:#7c5cbf}
@media(max-width:720px){.two-col{flex-direction:column}.left-menu{width:100%;max-height:220px}.stats{grid-template-columns:repeat(3,1fr)}.player-box iframe{height:240px}}
</style>
</head>
<body>
<div class="container">
  <div id="login-section">
    <div class="login-box">
      <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" onerror="this.style.display='none'" alt="AccessWorld">
      <h1>AccessWorld Seminars</h1>
      <p>Sign in to access your member library</p>
      <input type="email" id="email" placeholder="Email address">
      <input type="password" id="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
      <button class="btn btn-green" onclick="login()">Sign In</button>
      <div id="login-error" class="err"></div>
    </div>
  </div>

  <div id="dashboard" style="display:none">
    <div class="header">
      <div class="header-left">
        <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" onerror="this.style.display='none'" alt="">
        <h1>AccessWorld Library</h1>
      </div>
      <div class="header-right">
        <span class="tier-badge" id="tier-badge">Tier 1</span>
        <button class="btn btn-red" onclick="logout()">Sign Out</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat-card"><div class="stat-num" id="s-total">0</div><div class="stat-lbl">Videos</div></div>
      <div class="stat-card"><div class="stat-num" id="s-watched">0</div><div class="stat-lbl">Watched</div></div>
      <div class="stat-card"><div class="stat-num" id="s-notes">0</div><div class="stat-lbl">Notes</div></div>
    </div>

    <div class="tab-bar">
      <div class="tab active" id="btn-t1" onclick="showView('tier',1)">🎓 Tier 1</div>
      <div class="tab" id="btn-t2" onclick="showView('tier',2)">🎓 Tier 2</div>
      <div class="tab" id="btn-t3" onclick="showView('tier',3)">🎓 Tier 3</div>
      <div class="tab meditation-tab" id="btn-meditations" onclick="showView('meditations',0)">🧘 Meditations</div>
      <div class="tab" id="btn-notes" onclick="showView('notes',0)">📝 My Notes</div>
    </div>

    <div id="view-tier1"></div>
    <div id="view-tier2" style="display:none"></div>
    <div id="view-tier3" style="display:none"></div>
    <div id="view-meditations" style="display:none"></div>

    <div id="view-notes" style="display:none">
      <div class="notes-wrap">
        <div class="notes-back">
          <button class="btn btn-outline" onclick="showView('tier', lastTierTab)">← Back to Library</button>
        </div>
        <div class="note-form">
          <h3>✏️ Add a Note</h3>
          <input type="text" id="n-title" placeholder="Title — e.g. Coaching Lesson 3">
          <textarea id="n-body" placeholder="Write your notes here..."></textarea>
          <button class="btn btn-gold" style="margin-top:10px" onclick="saveNote()">Save Note</button>
        </div>
        <div id="notes-list"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SB_URL = "https://zwwodopezadqjazhajmx.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg"; // <-- REPLACE WITH YOUR REAL KEY
const sb = window.supabase.createClient(SB_URL, SB_KEY);

let lessons = [], watched = {}, notes = [];
let currentVideoId = null, currentUserTier = 1, lastTierTab = 1;
let builtTiers = {};

// ==================== MEDITATION KEYWORDS (SHARED ACROSS ALL TIERS) ====================
const MEDITATION_KEYWORDS = [
  "meditation", "guided breath", "the gift", "ultimate freedom", "universal freedom",
  "dancing with fear", "womb of eternity", "blue hat", "strategic visioning audio",
  "excitement meditation", "15 minute meditation", "breathwork"
];

function isSharedMeditation(video) {
  const title = (video.title || "").toLowerCase();
  return MEDITATION_KEYWORDS.some(kw => title.includes(kw));
}

// ==================== CATEGORIES ====================
const CATS = [
  {id:"nlp", icon:"🧠", name:"NLP Masterclass", kw:["nlp","unlock the power of stories","arcing energy","coach yourself"]},
  {id:"morning", icon:"🌅", name:"Morning Routine", kw:["morning","routine"]},
  {id:"coaching2024", icon:"👥", name:"Coaching 2024", kw:["2024"]},
  {id:"coaching2025", icon:"👥", name:"Coaching 2025", kw:["2025"]},
  {id:"coaching2026", icon:"👥", name:"Coaching 2026", kw:["2026"]},
  {id:"emotional", icon:"💚", name:"Emotional Clearing", kw:["emotional","clearing","joshua roy seminar leader","gift process","yelling","ball and fire","ultimate freedom","womb of eternity","1.0","1.2","1.5"]},
  {id:"health", icon:"🏥", name:"Health & Healing", kw:["health","healing"]},
  {id:"relationships", icon:"❤️", name:"Relationships", kw:["relationship"]},
  {id:"goals", icon:"🎯", name:"Goal Setting", kw:["goal"]},
  {id:"coachcert", icon:"📜", name:"World Class Coach Training", kw:["world class coach"]},
  {id:"intro", icon:"🎓", name:"Free Introductions", kw:["free introduction","nlp basics","confidence to succeed","full control of your uc mind"]},
  {id:"twoday", icon:"📅", name:"2 Day Seminar", kw:["gray room","emotional mastery seminar"]}
];

function catFor(title){
  // Skip meditation videos - they have their own tab
  if (isSharedMeditation({title})) return null;
  const t = title.toLowerCase();
  for(const c of CATS){
    if(c.kw.some(k => t.includes(k))) return c.name;
  }
  return "Bonus Resources";
}

// ==================== LOCAL STORAGE ====================
function loadLocal(){
  watched = JSON.parse(localStorage.getItem("aw_watched")||"{}");
  notes = JSON.parse(localStorage.getItem("aw_notes")||"[]");
}
function saveWatched(){ localStorage.setItem("aw_watched",JSON.stringify(watched)); }
function saveNotes(){ localStorage.setItem("aw_notes", JSON.stringify(notes)); }

// ==================== AUTH ====================
async function login(){
  const email = document.getElementById("email").value.trim();
  const pw = document.getElementById("password").value;
  const errEl = document.getElementById("login-error");
  errEl.innerText = "";
  
  const {data, error} = await sb.auth.signInWithPassword({email, password:pw});
  if(error){ 
    errEl.innerText = error.message; 
    return; 
  }
  
  // Try to get tier from profiles, default to 1 if table doesn't exist
  try {
    const {data: profile} = await sb.from("profiles").select("membership_tier").eq("email", email).single();
    currentUserTier = profile?.membership_tier || 1;
  } catch(e){ 
    currentUserTier = 1; 
  }
  
  document.getElementById("tier-badge").innerText = `Tier ${currentUserTier} Member`;
  await boot();
}

async function logout(){
  await sb.auth.signOut();
  location.reload();
}

async function boot(){
  loadLocal();
  const {data, error} = await sb.from("lessons").select("*").order("sort_order");
  if(error){ console.error(error); return; }
  lessons = data || [];
  document.getElementById("login-section").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  showView("tier", 1);
  updateStats();
}

// ==================== VIEW SWITCHING ====================
function showView(type, tier){
  ["view-tier1","view-tier2","view-tier3","view-meditations","view-notes"].forEach(id => document.getElementById(id).style.display = "none");
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

  if(type === "notes"){
    document.getElementById("view-notes").style.display = "block";
    document.getElementById("btn-notes").classList.add("active");
    renderNotes();
  } else if(type === "meditations"){
    document.getElementById("view-meditations").style.display = "block";
    document.getElementById("btn-meditations").classList.add("active");
    renderMeditationsView();
  } else {
    lastTierTab = tier;
    document.getElementById("view-tier"+tier).style.display = "block";
    document.getElementById("btn-t"+tier).classList.add("active");
    if(!builtTiers[tier]){
      buildTierView(tier);
      builtTiers[tier] = true;
    } else {
      refreshTierProgress(tier);
    }
  }
}

// ==================== MEDITATIONS VIEW (SHARED ACROSS ALL TIERS) ====================
function renderMeditationsView(){
  const medVideos = lessons.filter(v => isSharedMeditation(v));
  const container = document.getElementById("view-meditations");
  
  if(medVideos.length === 0){
    container.innerHTML = `<div class="empty">🧘 No meditation content found yet.</div>`;
    return;
  }
  
  const watchedCount = medVideos.filter(v => watched[v.id]).length;
  const progress = medVideos.length ? Math.round((watchedCount / medVideos.length) * 100) : 0;
  
  let html = `
    <div class="progress-wrap">
      <label><span>🧘 Meditations (Available to ALL members)</span><span>${watchedCount} of ${medVideos.length} listened</span></label>
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%; background:#7c5cbf"></div></div>
    </div>
    <div class="two-col">
      <div class="left-menu">
        <h4>📿 Meditation Library</h4>
        <div class="menu-item active" style="background:#7c5cbf; color:white;">
          <div class="menu-left"><span>🧘</span><span class="menu-label">All Meditations</span></div>
          <span class="menu-count">${medVideos.length}</span>
        </div>
      </div>
      <div class="right-col">
        <div class="cat-header">
          <h2>🧘 Meditations & Audio Library</h2>
          <p>These guided sessions are available to every member, regardless of tier. ${medVideos.length} tracks · ${watchedCount} completed</p>
        </div>
        <div id="med-vid-list"></div>
        <div id="player-box-med" class="player-box">
          <h3 id="p-title-med"></h3>
          <div class="player-desc" id="p-desc-med"></div>
          <span class="desc-toggle" id="desc-toggle-med" onclick="toggleDesc('med')" style="display:none">Show more ▼</span>
          <iframe id="p-iframe-med" src="" allowfullscreen></iframe>
          <div class="player-actions">
            <button class="btn btn-gold" id="p-watch-btn-med" onclick="toggleWatched('med')">✓ Mark as listened</button>
            <button class="btn btn-gray" onclick="closePlayer('med')">✕ Close</button>
            <span class="watched-label" id="p-watch-label-med"></span>
          </div>
        </div>
      </div>
    </div>
  `;
  container.innerHTML = html;
  
  // Build video list
  let vidHtml = "";
  medVideos.forEach(l => {
    const desc = l.description ? l.description.substring(0,90) + "…" : "Click to listen";
    const isW = watched[l.id];
    vidHtml += `<div class="vid-item" id="vi-${l.id}" onclick="selectMeditation(${l.id})">
      <div class="vid-info"><div class="vid-title">${esc(l.title)}</div><div class="vid-desc">${esc(desc)}</div></div>
      <div class="vid-meta">${isW ? '<span class="tick">✓</span>' : '<span class="play-icon">▶</span>'}</div>
    </div>`;
  });
  document.getElementById("med-vid-list").innerHTML = vidHtml || '<div class="empty">No meditations found.</div>';
}

function selectMeditation(id){
  const v = lessons.find(x => x.id === id);
  if(!v) return;
  currentVideoId = id;
  const container = document.getElementById("player-box-med");
  document.getElementById("p-title-med").innerText = v.title || "Untitled";
  document.getElementById("p-desc-med").innerText = v.description || "No description available.";
  const descEl = document.getElementById("p-desc-med");
  const toggle = document.getElementById("desc-toggle-med");
  if(descEl && descEl.scrollHeight > 80){
    toggle.style.display = "inline-block";
  } else {
    toggle.style.display = "none";
  }
  const embedUrl = getEmbedUrl(v.google_drive_embed_url || v.video_url || "");
  document.getElementById("p-iframe-med").src = embedUrl;
  const isWatched = !!watched[v.id];
  const watchBtn = document.getElementById("p-watch-btn-med");
  const watchLabel = document.getElementById("p-watch-label-med");
  watchBtn.innerText = isWatched ? "✓ Listened" : "Mark as listened";
  watchLabel.innerText = isWatched ? "✓ Completed" : "";
  container.classList.add("on");
  
  // Also show notes for this video
  const existingNote = notes.find(n => n.id === v.id);
  const noteArea = document.getElementById("med-note-area");
  if(!document.getElementById("med-note-area")){
    const noteHtml = `<div style="margin-top:16px;"><label>📝 Your notes:</label><textarea id="med-note-area" rows="2" style="width:100%;padding:10px;margin-top:8px;border-radius:8px;border:1px solid #ddd;">${existingNote ? esc(existingNote.text) : ""}</textarea><button class="btn btn-outline" style="margin-top:8px;" onclick="saveMeditationNote(${v.id})">Save Note</button></div>`;
    document.getElementById("player-box-med").insertAdjacentHTML("beforeend", noteHtml);
  } else {
    document.getElementById("med-note-area").value = existingNote ? existingNote.text : "";
  }
}

function saveMeditationNote(id){
  const noteText = document.getElementById("med-note-area").value.trim();
  if(!noteText) return;
  const video = lessons.find(v => v.id === id);
  const existingIdx = notes.findIndex(n => n.id === id);
  const noteObj = { id: id, title: video?.title || "Meditation", text: noteText, saved: new Date().toISOString() };
  if(existingIdx >= 0) notes[existingIdx] = noteObj;
  else notes.push(noteObj);
  saveNotes();
  updateStats();
  alert("Note saved!");
}

// ==================== BUILD TIER ====================
function buildTierView(tier){
  const container = document.getElementById("view-tier" + tier);
  if(tier > currentUserTier){
    container.innerHTML = `<div class="locked-box"><div class="lock-icon">🔒</div><h2>Tier ${tier} Content</h2><p>This tier contains advanced training. Complete Tier 1 first.</p><button class="btn btn-gold" onclick="contactUpgrade(${tier})">Contact Joshua Roy to Upgrade</button></div>`;
    return;
  }

  // Filter out meditation videos from tier content (they have their own tab)
  const tierLessons = lessons.filter(l => l.tier_required === tier && !isSharedMeditation(l));
  const watchedCount = tierLessons.filter(l => watched[l.id]).length;
  const progress = tierLessons.length ? Math.round((watchedCount / tierLessons.length) * 100) : 0;

  container.innerHTML = `
    <div class="progress-wrap" id="pw-${tier}">
      <label><span>Tier ${tier} Progress</span><span>${watchedCount} of ${tierLessons.length} watched</span></label>
      <div class="progress-bar"><div class="progress-fill" id="pf-${tier}" style="width:${progress}%"></div></div>
    </div>
    <div class="two-col">
      <div class="left-menu">
        <h4>Categories</h4>
        <div id="cat-menu-${tier}"></div>
      </div>
      <div class="right-col">
        <div class="cat-header">
          <h2 id="cat-title-${tier}">← Pick a category</h2>
          <p id="cat-sub-${tier}">Choose a section from the menu on the left</p>
        </div>
        <div id="vid-list-${tier}"></div>
        <div id="player-box-${tier}" class="player-box">
          <h3 id="p-title-${tier}"></h3>
          <div class="player-desc" id="p-desc-${tier}"></div>
          <span class="desc-toggle" id="desc-toggle-${tier}" onclick="toggleDesc(${tier})" style="display:none">Show more ▼</span>
          <iframe id="p-iframe-${tier}" src="" allowfullscreen></iframe>
          <div class="player-actions">
            <button class="btn btn-gold" id="p-watch-btn-${tier}" onclick="toggleWatched(${tier})">✓ Mark as watched</button>
            <button class="btn btn-gray" onclick="closePlayer(${tier})">✕ Close</button>
            <span class="watched-label" id="p-watch-label-${tier}"></span>
          </div>
        </div>
      </div>
    </div>`;

  buildCatMenu(tier);
}

function buildCatMenu(tier){
  const menu = document.getElementById("cat-menu-" + tier);
  let html = "";
  for(const c of CATS){
    const vids = lessons.filter(l => l.tier_required === tier && !isSharedMeditation(l) && catFor(l.title) === c.name);
    if(!vids.length) continue;
    const wc = vids.filter(l => watched[l.id]).length;
    html += `<div class="menu-item" id="mi-${c.id}-${tier}" onclick="selectCat('${c.id}',${tier})">
      <div class="menu-left"><span>${c.icon}</span><span class="menu-label">${c.name}</span>${wc>0?`<span class="w-badge">${wc}</span>`:""}</div>
      <span class="menu-count">${vids.length}</span>
    </div>`;
  }
  menu.innerHTML = html || '<div class="empty">No content yet.</div>';
}

function refreshTierProgress(tier){
  const tierLessons = lessons.filter(l => l.tier_required === tier && !isSharedMeditation(l));
  const watchedCount = tierLessons.filter(l => watched[l.id]).length;
  const progress = tierLessons.length ? Math.round((watchedCount / tierLessons.length) * 100) : 0;
  const pf = document.getElementById("pf-"+tier);
  if(pf) pf.style.width = progress + "%";
  buildCatMenu(tier);
}

function selectCat(catId, tier){
  const c = CATS.find(x => x.id === catId);
  if(!c) return;
  closePlayer(tier);
  document.querySelectorAll(`[id^="mi-"]`).forEach(m => m.classList.remove("active"));
  const mi = document.getElementById(`mi-${catId}-${tier}`);
  if(mi) mi.classList.add("active");

  const vids = lessons.filter(l => l.tier_required === tier && !isSharedMeditation(l) && catFor(l.title) === c.name);
  document.getElementById(`cat-title-${tier}`).innerText = c.icon + " " + c.name;
  document.getElementById(`cat-sub-${tier}`).innerText = vids.length + " video" + (vids.length !== 1 ? "s" : "");

  let html = "";
  vids.forEach(l => {
    const desc = l.description ? l.description.substring(0,90) + "…" : "Click to watch";
    const isW = watched[l.id];
    html += `<div class="vid-item" id="vi-${l.id}" onclick="selectVideo(${l.id},${tier})">
      <div class="vid-info"><div class="vid-title">${esc(l.title)}</div><div class="vid-desc">${esc(desc)}</div></div>
      <div class="vid-meta">${isW ? '<span class="tick">✓</span>' : ''}<span class="play-icon">▶</span></div>
    </div>`;
  });
  document.getElementById(`vid-list-${tier}`).innerHTML = html || '<div class="empty">No videos in this category yet.</div>';
}

function selectVideo(id, tier){
  const v = lessons.find(x => x.id === id);
  if(!v) return;
  if(v.tier_required > currentUserTier){ alert("Upgrade required"); return; }
  currentVideoId = id;
  const container = document.getElementById(`player-box-${tier}`);
  document.getElementById(`p-title-${tier}`).innerText = v.title || "Untitled";
  document.getElementById(`p-desc-${tier}`).innerText = v.description || "No description available.";
  const descEl = document.getElementById(`p-desc-${tier}`);
  const toggle = document.getElementById(`desc-toggle-${tier}`);
  if(descEl && descEl.scrollHeight > 80){
    toggle.style.display = "inline-block";
  } else {
    toggle.style.display = "none";
  }
  const embedUrl = getEmbedUrl(v.google_drive_embed_url || v.video_url || "");
  document.getElementById(`p-iframe-${tier}`).src = embedUrl;
  const isWatched = !!watched[v.id];
  const watchBtn = document.getElementById(`p-watch-btn-${tier}`);
  const watchLabel = document.getElementById(`p-watch-label-${tier}`);
  watchBtn.innerText = isWatched ? "✓ Watched" : "Mark as watched";
  watchLabel.innerText = isWatched ? "✓ Completed" : "";
  container.classList.add("on");
}

function toggleWatched(tierOrMed){
  let id = currentVideoId;
  if(!id) return;
  if(watched[id]){
    delete watched[id];
  } else {
    watched[id] = Date.now();
  }
  saveWatched();
  updateStats();
  if(tierOrMed === 'med'){
    renderMeditationsView();
    selectMeditation(id);
  } else {
    const tier = parseInt(tierOrMed);
    refreshTierProgress(tier);
    selectVideo(id, tier);
  }
}

function closePlayer(tierOrMed){
  if(tierOrMed === 'med'){
    document.getElementById("player-box-med").classList.remove("on");
  } else {
    document.getElementById(`player-box-${tierOrMed}`).classList.remove("on");
  }
}

function toggleDesc(tierOrMed){
  const descEl = document.getElementById(`p-desc-${tierOrMed}`);
  const toggle = document.getElementById(`desc-toggle-${tierOrMed}`);
  if(descEl.classList.contains("expanded")){
    descEl.classList.remove("expanded");
    toggle.innerText = "Show more ▼";
  } else {
    descEl.classList.add("expanded");
    toggle.innerText = "Show less ▲";
  }
}

function getEmbedUrl(url){
  if(!url) return "";
  if(url.includes("drive.google.com")) return url;
  if(url.includes("youtu.be") || url.includes("youtube.com")){
    let vid = url.match(/(?:youtu\.be\/|youtube.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
    if(vid) return `https://www.youtube.com/embed/${vid[1]}`;
  }
  return url;
}

// ==================== NOTES & STATS ====================
function saveNote(){
  const title = document.getElementById("n-title").value.trim();
  const text = document.getElementById("n-body").value.trim();
  if(!text) return;
  const note = { id: Date.now(), title: title || "Quick note", text: text, saved: new Date().toISOString() };
  notes.push(note);
  saveNotes();
  document.getElementById("n-title").value = "";
  document.getElementById("n-body").value = "";
  renderNotes();
  updateStats();
}

function renderNotes(){
  const container = document.getElementById("notes-list");
  if(!notes.length){
    container.innerHTML = '<div class="empty">📝 No notes yet. Add notes while watching videos.</div>';
    return;
  }
  const sorted = [...notes].reverse();
  let html = "";
  sorted.forEach(n => {
    html += `<div class="note-card">
      <div class="note-hdr"><span class="note-title">${esc(n.title)}</span><span class="note-date">${new Date(n.saved).toLocaleDateString()}</span></div>
      <div class="note-body">${esc(n.text).replace(/\n/g,"<br>")}</div>
      <button class="note-del" onclick="deleteNote(${n.id})">Delete</button>
    </div>`;
  });
  container.innerHTML = html;
}

function deleteNote(id){
  notes = notes.filter(n => n.id !== id);
  saveNotes();
  renderNotes();
  updateStats();
}

function updateStats(){
  const accessibleCount = lessons.filter(l => l.tier_required <= currentUserTier || isSharedMeditation(l)).length;
  const watchedCount = lessons.filter(l => watched[l.id]).length;
  document.getElementById("s-total").innerText = accessibleCount;
  document.getElementById("s-watched").innerText = watchedCount;
  document.getElementById("s-notes").innerText = notes.length;
}

function esc(s){ 
  if(!s) return ""; 
  return s.replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); 
}

function contactUpgrade(tier){ 
  window.location.href = `mailto:info@accessworldseminars.com?subject=Tier%20${tier}%20Upgrade`; 
}

// ==================== AUTO LOGIN ====================
window.onload = async () => {
  const {data:{user}} = await sb.auth.getUser();
  if(user) await boot();
};
