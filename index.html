<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AccessWorld Members Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #f0f4fa;
    min-height: 100vh;
  }
  /* Login Wrapper */
  .login-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1A2744 0%, #0f1724 100%);
  }
  .login-card {
    background: white;
    padding: 44px 40px;
    border-radius: 36px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    border: 1px solid rgba(201, 168, 76, 0.3);
  }
  .login-card img { height: 64px; margin-bottom: 18px; }
  .login-card h1 {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #1A2744, #2c3d5c);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
  }
  .login-card p { color: #5b6e8c; margin: 8px 0 28px; font-size: 14px; }
  .input-field { margin-bottom: 18px; text-align: left; }
  .input-field label { font-size: 12px; font-weight: 600; color: #2c3e66; margin-bottom: 6px; display: block; }
  .input-field input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 24px;
    font-size: 15px;
    transition: 0.2s;
  }
  .input-field input:focus { outline: none; border-color: #C9A84C; box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.2); }
  .btn-primary {
    background: #1D9E75;
    color: white;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 40px;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary:hover { background: #157f5c; transform: translateY(-1px); }
  .error-msg { color: #e53e3e; font-size: 14px; margin-top: 16px; }
  
  /* Dashboard Layout */
  .dashboard-container { display: none; max-width: 1400px; margin: 0 auto; background: #fff; border-radius: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.15); overflow: hidden; }
  .header { display: flex; justify-content: space-between; align-items: center; padding: 20px 32px; background: white; border-bottom: 1px solid #eef2f6; }
  .logo-area { display: flex; align-items: center; gap: 12px; }
  .logo-area img { height: 45px; }
  .logo-area h2 { font-size: 22px; color: #1A2744; font-weight: 700; }
  .tier-badge { background: #1D9E75; padding: 6px 16px; border-radius: 40px; color: white; font-weight: 700; font-size: 12px; }
  .btn-logout { background: #f1f3f7; border: none; padding: 8px 20px; border-radius: 40px; font-weight: 600; cursor: pointer; }
  
  /* Stats */
  .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 24px 32px 0 32px; }
  .stat-card { background: #F9FAFE; border-radius: 24px; padding: 18px; text-align: center; border: 1px solid #eef2f8; }
  .stat-number { font-size: 34px; font-weight: 800; color: #1A2744; }
  .stat-label { font-size: 12px; color: #62748c; margin-top: 5px; }
  
  /* Tabs */
  .tab-bar { display: flex; gap: 8px; padding: 20px 32px 0 32px; border-bottom: 1px solid #eef2f6; background: white; }
  .tab { padding: 10px 24px; font-weight: 700; font-size: 14px; cursor: pointer; color: #8a99b0; border-radius: 40px; transition: 0.2s; }
  .tab.active { background: #1A2744; color: white; }
  .tab.meditation-tab.active { background: #7c5cbf; color: white; }
  .content-pane { padding: 24px 32px 32px 32px; background: white; }
  
  /* Categories & Videos */
  .two-columns { display: flex; gap: 28px; flex-wrap: wrap; }
  .category-sidebar { width: 270px; flex-shrink: 0; background: #F9FAFE; border-radius: 28px; padding: 16px; max-height: 620px; overflow-y: auto; }
  .category-item { padding: 12px 14px; margin-bottom: 6px; border-radius: 18px; display: flex; justify-content: space-between; cursor: pointer; font-weight: 600; font-size: 14px; color: #2c3e66; }
  .category-item:hover { background: #eef2fa; }
  .category-item.active { background: #1A2744; color: white; }
  .right-area { flex: 1; min-width: 0; }
  .video-list { display: flex; flex-direction: column; gap: 10px; max-height: 500px; overflow-y: auto; }
  .video-card { background: #fff; border: 1.5px solid #eef2f8; border-radius: 20px; padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .video-card:hover { border-color: #C9A84C; background: #FFFDF5; }
  .video-info h4 { font-size: 15px; font-weight: 700; color: #1f2e4a; }
  .watch-check { font-size: 20px; color: #1D9E75; }
  .player-panel { margin-top: 24px; background: #F9FAFE; border-radius: 28px; padding: 22px; display: none; }
  .player-panel.show { display: block; }
  iframe { width: 100%; height: 420px; border-radius: 20px; border: none; background: #0a0f1c; }
  
  @media (max-width: 760px) {
    .stats-row { grid-template-columns: repeat(2,1fr); }
    .category-sidebar { width: 100%; max-height: 200px; }
    .two-columns { flex-direction: column; }
    iframe { height: 240px; }
    .tab { padding: 6px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<!-- LOGIN SECTION -->
<div id="loginView" class="login-wrapper">
  <div class="login-card">
    <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" alt="AccessWorld" onerror="this.style.display='none'">
    <h1>AccessWorld Seminars</h1>
    <p>Sign in to access your library</p>
    <div class="input-field">
      <label>Email</label>
      <input type="email" id="loginEmail" placeholder="member@accessworld.com">
    </div>
    <div class="input-field">
      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••">
    </div>
    <button class="btn-primary" id="doLoginBtn">Sign In →</button>
    <div id="loginErrorMessage" class="error-msg"></div>
  </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboardView" class="dashboard-container">
  <div class="header">
    <div class="logo-area">
      <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" alt="logo" onerror="this.style.display='none'">
      <h2>AccessWorld Library</h2>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span id="userTierBadge" class="tier-badge">Tier 1</span>
      <button id="logoutBtn" class="btn-logout">Sign Out</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-card"><div class="stat-number" id="totalCount">0</div><div class="stat-label">Total Videos</div></div>
    <div class="stat-card"><div class="stat-number" id="watchedCount">0</div><div class="stat-label">Watched</div></div>
    <div class="stat-card"><div class="stat-number" id="notesCount">0</div><div class="stat-label">Notes</div></div>
    <div class="stat-card"><div class="stat-number" id="completePercent">0%</div><div class="stat-label">Complete</div></div>
  </div>

  <div class="tab-bar" id="tabContainer">
    <div class="tab" data-tab="tier1">⭐ Tier 1</div>
    <div class="tab" data-tab="tier2">🚀 Tier 2</div>
    <div class="tab" data-tab="tier3">🏆 Tier 3</div>
    <div class="tab meditation-tab" data-tab="meditations">🧘 Meditations (All Tiers)</div>
  </div>

  <div class="content-pane" id="mainContentArea">
    <!-- Dynamic content loads here -->
  </div>
</div>

<script>
  // ======================== CONFIGURATION ===========================
  const SUPABASE_URL = "https://zwwodopezadqjazhajmx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg"; // <-- REPLACE THIS
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  
  // ======================== GLOBAL STATE ============================
  let allVideos = [];
  let watchedMap = {};
  let userNotes = [];
  let currentUserTier = 1;     // 1,2,3
  let currentTab = "tier1";
  let activeCategoryId = null;
  let activeVideoId = null;
  
  // ======================== CATEGORIES (Dynamic matching) ===========
  const TIER_CATEGORIES = {
    1: [
      { id: "unlock", name: "🌟 Unlock Yourself", kw: ["unlock your incredible", "artistry explained", "listen to the attendees"] },
      { id: "morning", name: "🌅 Morning Routine", kw: ["morning routine"] },
      { id: "group_early", name: "👥 Group Coaching (22-23)", kw: ["group coaching - aug 2022", "jun 2022", "oct 2023", "goal setting"] },
      { id: "emotional", name: "💚 Emotional Clearing", kw: ["emotional clearing", "gift process", "yelling", "ball and fire"] },
      { id: "nlp_basic", name: "🧠 NLP Basics", kw: ["nlp basics", "take full control", "confidence to succeed"] },
      { id: "health", name: "🏥 Health & Healing", kw: ["acid alkaline", "health & energy"] }
    ],
    2: [
      { id: "intro_free", name: "🎓 Free Introductions", kw: ["free introduction", "nlp for beginners", "money mindset", "feeling stuck"] },
      { id: "nlp_state", name: "🧠 NLP State & Foundation", kw: ["nlp state elicitation", "nlp foundation principles"] },
      { id: "wcc", name: "📜 World Class Coach Training", kw: ["coaching lesson", "how to become a world class coach"] }
    ],
    3: [
      { id: "nlp_master", name: "🧠 NLP Masterclass", kw: ["nlp - nlp", "collapse anchors", "incantations", "grey room", "self image"] },
      { id: "gc2024", name: "👥 Group Coaching 2024", kw: ["group coaching 2024", "020224", "080724", "19012024"] },
      { id: "gc2025", name: "👥 Group Coaching 2025", kw: ["group coaching 2025", "010425", "140225", "211125"] },
      { id: "gc2026", name: "👥 Group Coaching 2026", kw: ["group coaching 2026", "020126", "090126", "230126"] },
      { id: "adv_sem", name: "🎪 Advanced Seminars", kw: ["emotional mastery", "holistic health", "life skills", "nsr"] }
    ]
  };
  
  // Shared Meditation Keywords (accessible to all tiers)
  const MEDITATION_KEYWORDS = ["meditation", "guided breath", "the gift", "ultimate freedom", "dancing with fear", "womb of eternity", "blue hat", "strategic visioning audio", "excitement meditation"];
  
  // Helper: Check if video is a meditation (shared)
  function isSharedMeditation(video) {
    const title = (video.title || "").toLowerCase();
    return MEDITATION_KEYWORDS.some(kw => title.includes(kw));
  }
  
  // Get category for tier-based videos
  function getVideoCategory(video, tierNum) {
    if (isSharedMeditation(video)) return null; // handled by meditations tab
    const titleLower = (video.title || "").toLowerCase();
    const cats = TIER_CATEGORIES[tierNum] || [];
    for (let cat of cats) {
      if (cat.kw.some(k => titleLower.includes(k))) return cat;
    }
    return { id: "other", name: "📁 Other Content", kw: [] };
  }
  
  // ======================== LOCAL STORAGE ============================
  function loadLocalData() {
    try {
      const w = localStorage.getItem("aw_watched");
      if (w) watchedMap = JSON.parse(w);
      const n = localStorage.getItem("aw_notes");
      if (n) userNotes = JSON.parse(n);
    } catch(e) {}
  }
  function persistWatched() { localStorage.setItem("aw_watched", JSON.stringify(watchedMap)); }
  function persistNotes() { localStorage.setItem("aw_notes", JSON.stringify(userNotes)); }
  
  // ======================== AUTH & BOOTSTRAP =========================
  async function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;
    const errDiv = document.getElementById("loginErrorMessage");
    errDiv.innerText = "";
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { errDiv.innerText = error.message; return; }
    // Fetch membership tier from profiles
    let tier = 1;
    try {
      const { data: profile } = await supabase.from("profiles").select("membership_tier").eq("email", email).single();
      tier = profile?.membership_tier || 1;
    } catch(e) { console.warn(e); }
    currentUserTier = Math.min(tier, 3);
    document.getElementById("userTierBadge").innerText = `Tier ${currentUserTier} Member`;
    await loadVideosAndBoot();
  }
  
  async function loadVideosAndBoot() {
    const { data, error } = await supabase.from("lessons").select("*").order("sort_order", { ascending: true });
    if (error) { console.error(error); return; }
    allVideos = data || [];
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashboardView").style.display = "block";
    updateStatsUI();
    switchTab("tier1");
  }
  
  function updateStatsUI() {
    const accessible = allVideos.filter(v => v.tier_required <= currentUserTier || isSharedMeditation(v));
    const watchedCount = accessible.filter(v => watchedMap[v.id]).length;
    const pct = accessible.length ? Math.round((watchedCount / accessible.length) * 100) : 0;
    document.getElementById("totalCount").innerText = accessible.length;
    document.getElementById("watchedCount").innerText = watchedCount;
    document.getElementById("notesCount").innerText = userNotes.length;
    document.getElementById("completePercent").innerText = pct + "%";
  }
  
  // ======================== RENDER TIER VIEW =========================
  function renderTierView(tierNum) {
    if (tierNum > currentUserTier) {
      document.getElementById("mainContentArea").innerHTML = `<div style="text-align:center; padding:80px;"><span style="font-size:56px;">🔒</span><h2>Tier ${tierNum} Locked</h2><p>Upgrade your membership to access this content.</p></div>`;
      return;
    }
    const tierVideos = allVideos.filter(v => v.tier_required === tierNum && !isSharedMeditation(v));
    const catsMap = new Map();
    tierVideos.forEach(v => {
      const cat = getVideoCategory(v, tierNum);
      if (!cat) return;
      if (!catsMap.has(cat.id)) catsMap.set(cat.id, { ...cat, videos: [] });
      catsMap.get(cat.id).videos.push(v);
    });
    let categoriesArray = Array.from(catsMap.values());
    if (categoriesArray.length === 0) {
      document.getElementById("mainContentArea").innerHTML = `<div style="text-align:center; padding:60px;">✨ No content available yet for Tier ${tierNum}.</div>`;
      return;
    }
    if (!activeCategoryId || !catsMap.has(activeCategoryId)) activeCategoryId = categoriesArray[0].id;
    const currentCat = catsMap.get(activeCategoryId);
    const watchedCount = currentCat.videos.filter(v => watchedMap[v.id]).length;
    const progress = currentCat.videos.length ? (watchedCount / currentCat.videos.length) * 100 : 0;
    
    let leftHtml = `<div class="category-sidebar"><div style="font-weight:700; margin-bottom:12px;">📂 Categories</div>`;
    categoriesArray.forEach(cat => {
      leftHtml += `<div class="category-item ${activeCategoryId === cat.id ? 'active' : ''}" data-cat-id="${cat.id}">
        ${cat.name} <span class="cat-count" style="background:#e2e8f0; padding:2px 8px; border-radius:30px;">${cat.videos.length}</span>
      </div>`;
    });
    leftHtml += `</div>`;
    
    let rightHtml = `<div class="right-area">
      <div style="font-size:22px; font-weight:700;">${currentCat.name}</div>
      <div style="font-size:13px; color:#6f7d98; margin: 8px 0 16px;">${currentCat.videos.length} videos · ${watchedCount} watched</div>
      <div class="progress-section" style="margin-bottom:20px;"><div style="background:#e4e9f2; border-radius:30px; height:6px;"><div style="width:${progress}%; background:#1D9E75; height:6px; border-radius:30px;"></div></div></div>
      <div class="video-list" id="videoListContainer"></div>
      <div id="playerPanel" class="player-panel"></div>
    </div>`;
    
    document.getElementById("mainContentArea").innerHTML = `<div class="two-columns">${leftHtml}${rightHtml}</div>`;
    // attach category click
    document.querySelectorAll(".category-item").forEach(el => {
      el.addEventListener("click", () => {
        activeCategoryId = el.getAttribute("data-cat-id");
        renderTierView(tierNum);
      });
    });
    // render video list
    const vidContainer = document.getElementById("videoListContainer");
    vidContainer.innerHTML = currentCat.videos.map(v => `
      <div class="video-card" data-video-id="${v.id}">
        <div class="video-info"><h4>${escapeHtml(v.title)}</h4><p>${v.description ? v.description.substring(0,70)+"…" : "Click to watch"}</p></div>
        <div class="watch-check">${watchedMap[v.id] ? "✓" : "▶"}</div>
      </div>
    `).join("");
    document.querySelectorAll(".video-card").forEach(card => {
      card.addEventListener("click", () => {
        const vid = parseInt(card.getAttribute("data-video-id"));
        activeVideoId = vid;
        renderTierView(tierNum);
        showPlayer(vid, tierNum);
      });
    });
    if (activeVideoId) showPlayer(activeVideoId, tierNum);
  }
  
  // ======================== MEDITATIONS (SHARED ACROSS TIERS) ========
  function renderMeditationsView() {
    const medVideos = allVideos.filter(v => isSharedMeditation(v));
    if (medVideos.length === 0) {
      document.getElementById("mainContentArea").innerHTML = `<div style="text-align:center; padding:80px;">🧘 No meditation content found yet.</div>`;
      return;
    }
    const watchedCount = medVideos.filter(v => watchedMap[v.id]).length;
    const progress = (watchedCount / medVideos.length) * 100;
    let html = `<div><div style="font-size:28px; font-weight:800; color:#7c5cbf;">🧘 Meditations & Audio</div>
      <p style="margin: 8px 0 20px;">✨ Shared library — available to all members regardless of tier. ${medVideos.length} tracks, ${watchedCount} listened.</p>
      <div style="background:#e4e9f2; border-radius:30px; height:6px; margin-bottom:24px;"><div style="width:${progress}%; background:#7c5cbf; height:6px; border-radius:30px;"></div></div>
      <div class="video-list" id="medVideoList"></div>
      <div id="medPlayerPanel" class="player-panel"></div>
    </div>`;
    document.getElementById("mainContentArea").innerHTML = html;
    const medContainer = document.getElementById("medVideoList");
    medContainer.innerHTML = medVideos.map(v => `
      <div class="video-card" data-video-id="${v.id}" style="border-color:#e0d6f0;">
        <div class="video-info"><h4>${escapeHtml(v.title)}</h4><p>${v.description ? v.description.substring(0,70) : "Guided session"}</p></div>
        <div class="watch-check">${watchedMap[v.id] ? "✓" : "▶"}</div>
      </div>
    `).join("");
    document.querySelectorAll("#medVideoList .video-card").forEach(card => {
      card.addEventListener("click", () => {
        const vid = parseInt(card.getAttribute("data-video-id"));
        showMeditationPlayer(vid, medVideos);
      });
    });
    if (activeVideoId && medVideos.some(v => v.id === activeVideoId)) showMeditationPlayer(activeVideoId, medVideos);
  }
  
  function showMeditationPlayer(videoId, medList) {
    const lesson = medList.find(v => v.id === videoId);
    if (!lesson) return;
    const isWatched = !!watchedMap[lesson.id];
    const playerDiv = document.getElementById("medPlayerPanel");
    if (!playerDiv) return;
    playerDiv.classList.add("show");
    playerDiv.innerHTML = `
      <div style="font-size:20px; font-weight:800;">${escapeHtml(lesson.title)}</div>
      <div style="margin: 12px 0;">${escapeHtml(lesson.description || "No description")}</div>
      <iframe src="${getEmbedUrl(lesson.google_drive_embed_url || lesson.video_url || "")}" allowfullscreen></iframe>
      <div style="display:flex; gap:16px; margin-top:20px;">
        <button id="watchMedBtn" style="background:#7c5cbf; border:none; padding:10px 24px; border-radius:40px; color:white; font-weight:700;">${isWatched ? "✓ Watched" : "Mark as Listened"}</button>
        <button id="closeMedBtn" style="background:#e2e8f0; border:none; padding:10px 24px; border-radius:40px;">Close</button>
      </div>
      <div style="margin-top:20px;"><textarea id="medNoteText" rows="2" style="width:100%; padding:12px; border-radius:20px;" placeholder="Add a note about this meditation..."></textarea>
      <button id="saveMedNoteBtn" style="margin-top:8px; background:#1D9E75; border:none; padding:8px 20px; border-radius:30px; color:white;">Save Note</button></div>
    `;
    document.getElementById("watchMedBtn")?.addEventListener("click", () => {
      if (watchedMap[lesson.id]) delete watchedMap[lesson.id];
      else watchedMap[lesson.id] = true;
      persistWatched();
      updateStatsUI();
      renderMeditationsView();
    });
    document.getElementById("closeMedBtn")?.addEventListener("click", () => renderMeditationsView());
    document.getElementById("saveMedNoteBtn")?.addEventListener("click", () => {
      const noteText = document.getElementById("medNoteText").value.trim();
      if (noteText) {
        const existing = userNotes.findIndex(n => n.id === lesson.id);
        const newNote = { id: lesson.id, title: lesson.title, text: noteText, updatedAt: new Date().toISOString() };
        if (existing !== -1) userNotes[existing] = newNote;
        else userNotes.push(newNote);
        persistNotes();
        updateStatsUI();
        alert("Note saved");
      }
    });
  }
  
  function showPlayer(videoId, tierNum) {
    const lesson = allVideos.find(v => v.id === videoId);
    if (!lesson) return;
    const isWatched = !!watchedMap[lesson.id];
    const playerDiv = document.getElementById("playerPanel");
    if (!playerDiv) return;
    playerDiv.classList.add("show");
    playerDiv.innerHTML = `
      <div style="font-size:20px; font-weight:800;">${escapeHtml(lesson.title)}</div>
      <div style="margin: 12px 0;">${escapeHtml(lesson.description || "No description")}</div>
      <iframe src="${getEmbedUrl(lesson.google_drive_embed_url || lesson.video_url || "")}" allowfullscreen></iframe>
      <div style="display:flex; gap:16px; margin-top:20px;">
        <button id="watchToggleBtn" style="background:#1D9E75; border:none; padding:10px 24px; border-radius:40px; color:white;">${isWatched ? "✓ Watched" : "Mark Watched"}</button>
        <button id="closePlayerBtn" style="background:#e2e8f0; border:none; padding:10px 24px; border-radius:40px;">Close</button>
      </div>
      <div style="margin-top:20px;"><textarea id="videoNoteText" rows="2" style="width:100%; padding:12px; border-radius:20px;" placeholder="Write your notes..."></textarea>
      <button id="saveNoteBtn" style="margin-top:8px; background:#C9A84C; border:none; padding:8px 20px; border-radius:30px;">Save Note</button></div>
    `;
    document.getElementById("watchToggleBtn")?.addEventListener("click", () => {
      if (watchedMap[lesson.id]) delete watchedMap[lesson.id];
      else watchedMap[lesson.id] = true;
      persistWatched();
      updateStatsUI();
      renderTierView(tierNum);
    });
    document.getElementById("closePlayerBtn")?.addEventListener("click", () => renderTierView(tierNum));
    document.getElementById("saveNoteBtn")?.addEventListener("click", () => {
      const noteText = document.getElementById("videoNoteText").value.trim();
      if (noteText) {
        const existing = userNotes.findIndex(n => n.id === lesson.id);
        const newNote = { id: lesson.id, title: lesson.title, text: noteText, updatedAt: new Date().toISOString() };
        if (existing !== -1) userNotes[existing] = newNote;
        else userNotes.push(newNote);
        persistNotes();
        updateStatsUI();
        alert("Note saved");
      }
    });
  }
  
  function getEmbedUrl(url) {
    if (!url) return "";
    if (url.includes("drive.google.com")) return url;
    if (url.includes("youtu.be") || url.includes("youtube.com")) {
      let vid = url.match(/(?:youtu\.be\/|youtube.com\/watch\?v=)([a-zA-Z0-9_-]{11})/);
      return vid ? `https://www.youtube.com/embed/${vid[1]}` : url;
    }
    return url;
  }
  
  function switchTab(tabId) {
    currentTab = tabId;
    activeVideoId = null;
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    const targetTab = document.querySelector(`.tab[data-tab="${tabId}"]`);
    if (targetTab) targetTab.classList.add("active");
    if (tabId === "meditations") renderMeditationsView();
    else if (tabId === "tier1") renderTierView(1);
    else if (tabId === "tier2") renderTierView(2);
    else if (tabId === "tier3") renderTierView(3);
  }
  
  function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
  
  // ======================== EVENT LISTENERS ==========================
  document.getElementById("doLoginBtn")?.addEventListener("click", handleLogin);
  document.getElementById("logoutBtn")?.addEventListener("click", async () => { await supabase.auth.signOut(); location.reload(); });
  document.getElementById("tabContainer")?.addEventListener("click", (e) => {
    const tabDiv = e.target.closest(".tab");
    if (tabDiv && tabDiv.getAttribute("data-tab")) switchTab(tabDiv.getAttribute("data-tab"));
  });
  
  // Auto-restore session
  window.onload = async () => {
    loadLocalData();
    const { data: { user } } = await supabase.auth.getUser();
    if (user) {
      let tier = 1;
      try {
        const { data: profile } = await supabase.from("profiles").select("membership_tier").eq("email", user.email).single();
        tier = profile?.membership_tier || 1;
      } catch(e) {}
      currentUserTier = Math.min(tier, 3);
      document.getElementById("userTierBadge").innerText = `Tier ${currentUserTier} Member`;
      await loadVideosAndBoot();
    } else {
      document.getElementById("loginView").style.display = "flex";
      document.getElementById("dashboardView").style.display = "none";
    }
  };
</script>
</body>
