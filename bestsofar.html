<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AccessWorld – Member Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(145deg, #0F172A 0%, #111827 100%);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    padding: 24px 20px;
  }
  .portal {
    max-width: 1400px;
    margin: 0 auto;
    background: #ffffff;
    border-radius: 2rem;
    box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4);
    overflow: hidden;
  }
  .login-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 85vh;
    background: #ffffff;
  }
  .login-card {
    background: white;
    padding: 44px 40px;
    border-radius: 2rem;
    max-width: 460px;
    width: 100%;
    text-align: center;
    border: 1px solid rgba(201, 168, 76, 0.3);
    box-shadow: 0 20px 35px -12px rgba(0,0,0,0.08);
  }
  .login-card img { height: 68px; object-fit: contain; margin-bottom: 16px; }
  .login-card h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(135deg, #1A2744, #2A3A5C);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.3px;
  }
  .login-card p { color: #5b6e8c; margin: 10px 0 28px; font-size: 14px; }
  .input-field { margin-bottom: 18px; text-align: left; }
  .input-field label {
    font-size: 12px;
    font-weight: 600;
    color: #2c3e66;
    margin-bottom: 6px;
    display: block;
    letter-spacing: 0.3px;
  }
  .input-field input {
    width: 100%;
    padding: 14px 16px;
    border: 1.5px solid #e2e8f0;
    border-radius: 28px;
    font-size: 15px;
    transition: 0.2s;
    background: #fefefe;
  }
  .input-field input:focus {
    outline: none;
    border-color: #C9A84C;
    box-shadow: 0 0 0 3px rgba(201,168,76,0.2);
  }
  .btn {
    border: none;
    border-radius: 40px;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary {
    background: #1D9E75;
    color: white;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    box-shadow: 0 6px 14px rgba(29,158,117,0.3);
  }
  .btn-primary:hover { background: #157f5c; transform: translateY(-1px); }
  .btn-outline-gold {
    background: transparent;
    border: 1.5px solid #C9A84C;
    color: #C9A84C;
    padding: 8px 18px;
    font-weight: 600;
    border-radius: 40px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-outline-gold:hover {
    background: #C9A84C;
    color: #1A2744;
  }
  .error-message { color: #dc3c4c; font-size: 13px; margin-top: 16px; }

  .dashboard-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 32px; background: white; border-bottom: 1px solid #edf2f7;
  }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-area img { height: 44px; }
  .logo-area h2 { font-size: 22px; font-weight: 700; color: #1A2744; }
  .tier-badge {
    background: #1D9E75; padding: 6px 18px; border-radius: 40px;
    font-size: 12px; font-weight: 700; color: white;
  }
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
    padding: 24px 32px 0 32px;
  }
  .stat-card {
    background: #F9FAFE; border-radius: 1.5rem; padding: 18px 12px;
    text-align: center; border: 1px solid #eef2f8;
  }
  .stat-number { font-size: 36px; font-weight: 800; color: #1A2744; }
  .stat-label { font-size: 12px; color: #62748c; margin-top: 6px; }

  .tabs-row { display: flex; gap: 6px; padding: 20px 32px 0; border-bottom: 1px solid #edf2f7; background: white; flex-wrap: wrap; }
  .tab-btn {
    background: transparent; border: none; padding: 10px 24px; font-weight: 700;
    font-size: 14px; cursor: pointer; color: #8a99b0; border-radius: 40px;
  }
  .tab-btn.active { background: #1A2744; color: white; }

  .content-area { padding: 28px 32px 32px; background: white; }
  .two-columns { display: flex; gap: 28px; flex-wrap: wrap; }
  .sidebar { width: 280px; flex-shrink: 0; background: #F9FAFE; border-radius: 1.5rem; padding: 18px 14px; max-height: 620px; overflow-y: auto; }
  .category-item {
    padding: 10px 12px; margin-bottom: 6px; border-radius: 14px;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; font-weight: 600; font-size: 13px; color: #2c3e66;
  }
  .category-item:hover { background: #eef2fa; }
  .category-item.active { background: #1A2744; color: white; }
  .cat-count { background: rgba(0,0,0,0.05); padding: 2px 8px; border-radius: 30px; font-size: 11px; }

  .main-panel { flex: 1; }
  .category-title { font-size: 24px; font-weight: 700; color: #1A2744; margin-bottom: 6px; }
  .video-list { display: flex; flex-direction: column; gap: 10px; max-height: 460px; overflow-y: auto; }
  .video-card {
    background: white; border: 1.5px solid #eef2f8; border-radius: 18px;
    padding: 14px 18px; cursor: pointer; display: flex; justify-content: space-between;
  }
  .video-card:hover { border-color: #C9A84C; }
  .video-card.active-video { border-left: 5px solid #1D9E75; background: #F2F9F5; }

  .player-panel { margin-top: 24px; background: #F9FAFE; border-radius: 1.5rem; padding: 22px; display: none; }
  .player-panel.show { display: block; }
  iframe { width: 100%; height: 400px; border-radius: 1.2rem; border: none; }

  @media (max-width: 760px) {
    .stats-grid { grid-template-columns: repeat(2,1fr); }
    .sidebar { width: 100%; }
    .two-columns { flex-direction: column; }
    iframe { height: 240px; }
  }
</style>
</head>
<body>
<div class="portal">
  <!-- LOGIN VIEW -->
  <div id="loginView">
    <div class="login-panel">
      <div class="login-card">
        <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" alt="AccessWorld" onerror="this.style.display='none'">
        <h1>AccessWorld Seminars</h1>
        <p>Sign in to access your member library</p>
        <div class="input-field">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="your@email.com">
        </div>
        <div class="input-field">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" 
                 onkeydown="if(event.key==='Enter') handleLogin()">
        </div>
        <button class="btn btn-primary" onclick="handleLogin()">Sign In →</button>
        <div id="loginErrorMsg" class="error-message"></div>
      </div>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardView" style="display: none;">
    <div class="dashboard-header">
      <div class="logo-area">
        <img src="https://i.ibb.co/ynXdYpmL/worldjjpgsf.png" alt="logo">
        <h2>AccessWorld Library</h2>
      </div>
      <div style="display:flex; gap:12px; align-items:center;">
        <span id="userTierBadge" class="tier-badge">Tier 1</span>
        <button onclick="logout()" class="btn-outline-gold">Sign Out</button>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-number" id="totalVideosStat">0</div><div class="stat-label">Videos</div></div>
      <div class="stat-card"><div class="stat-number" id="watchedStat">0</div><div class="stat-label">Watched</div></div>
      <div class="stat-card"><div class="stat-number" id="notesCountStat">0</div><div class="stat-label">Notes</div></div>
    </div>

    <div class="tabs-row" id="tabContainer">
      <button class="tab-btn active" data-tab="tier1">⭐ Tier 1</button>
      <button class="tab-btn" data-tab="tier2">🚀 Tier 2</button>
      <button class="tab-btn" data-tab="tier3">🏆 Tier 3</button>
      <button class="tab-btn" data-tab="notes">📝 My Notes</button>
    </div>

    <div class="content-area" id="dynamicContent"></div>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://zwwodopezadqjazhajmx.supabase.co";
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp3d29kb3BlemFkcWphemhham14Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMzQ4ODEsImV4cCI6MjA5NjYxMDg4MX0.xiY_Kg0O0_g714YRHmgcuSd08qKi9ErJ1iz3ehZetIg";
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let allVideos = [];
  let watchedMap = {};
  let userNotes = [];
  let currentUserTier = 1;
  let activeCategoryId = null;
  let activeVideoId = null;

  const CATEGORIES = [
    { id: "unlock", name: "🌟 Unlock Yourself", tier: 1, kw: ["unlock your incredible", "artistry explained", "listen to the attendees"] },
    { id: "morning", name: "🌅 Morning Routine", tier: 1, kw: ["morning routine"] },
    { id: "group", name: "👥 Group Coaching & Mentoring", tier: 1, kw: ["group coaching", "goal setting", "jan 2024", "apr 2024", "feb 2025", "mar 2025", "jan 2026"] },
    { id: "emotional", name: "💚 Emotional Clearing", tier: 1, kw: ["emotional clearing", "gift process", "yelling", "ball and fire", "grey room", "ultimate freedom"] },
    { id: "health", name: "🏥 Health & Healing", tier: 1, kw: ["acid alkaline", "health & energy", "pain & healing", "healing sadness", "holistic health"] },
    { id: "nlp_basic", name: "🧠 NLP Basics", tier: 1, kw: ["nlp basics", "take full control", "confidence to succeed", "strategic visioning"] },
    { id: "intro", name: "🎓 Free Introductions", tier: 2, kw: ["free introduction", "nlp for beginners", "money mindset", "feeling stuck"] },
    { id: "wcc", name: "📜 World Class Coach Training", tier: 2, kw: ["coaching lesson", "how to become a world class coach"] },
    { id: "adv_sem", name: "🎪 Advanced Seminars", tier: 3, kw: ["emotional mastery seminar", "holistic health webinar", "day 1", "day 2"] },
    { id: "meditation", name: "🧘 Meditations & Audio", tier: 1, kw: ["meditation", "the gift", "guided breath"] }
  ];

  function getCategoryForVideo(video) {
    const title = (video.title || "").toLowerCase();
    for (let cat of CATEGORIES) {
      if (cat.kw.some(k => title.includes(k.toLowerCase()))) return cat;
    }
    return { id: "other", name: "📁 Other Content", tier: video.tier_required || 1 };
  }

  function loadLocal() {
    if (localStorage.getItem("aw_watched")) watchedMap = JSON.parse(localStorage.getItem("aw_watched"));
    if (localStorage.getItem("aw_notes")) userNotes = JSON.parse(localStorage.getItem("aw_notes"));
  }
  function persistWatched() { localStorage.setItem("aw_watched", JSON.stringify(watchedMap)); }
  function persistNotes() { localStorage.setItem("aw_notes", JSON.stringify(userNotes)); }

  async function handleLogin() {
    const email = document.getElementById("loginEmail").value.trim();
    const pwd = document.getElementById("loginPassword").value;
    const errDiv = document.getElementById("loginErrorMsg");
    errDiv.innerText = "";

    if (!email || !pwd) {
      errDiv.innerText = "Please enter email and password";
      return;
    }

    errDiv.innerText = "Signing in...";
    errDiv.style.color = "#1D9E75";

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password: pwd });
    if (error) {
      errDiv.style.color = "#dc3c4c";
      errDiv.innerText = error.message;
      return;
    }

    let userTier = 1;
    try {
      const { data: prof } = await sbClient.from("profiles").select("membership_tier").eq("email", email).maybeSingle();
      userTier = prof?.membership_tier || 1;
    } catch(e) { console.warn("No profiles table or error", e); }

    currentUserTier = Math.min(userTier, 3);
    document.getElementById("userTierBadge").innerText = currentUserTier >= 3 ? "Full Access" : `Tier ${currentUserTier}`;

    await loadVideosAndStart();
  }

  async function loadVideosAndStart() {
    const { data, error } = await sbClient.from("lessons").select("*").order("sort_order", { ascending: true });
    if (error) {
      alert("Failed to load library: " + error.message);
      return;
    }
    allVideos = data || [];
    document.getElementById("loginView").style.display = "none";
    document.getElementById("dashboardView").style.display = "block";
    updateStatistics();
    switchTab("tier1");
  }

  function logout() {
    sbClient.auth.signOut();
    location.reload();
  }

  function updateStatistics() {
    const accessible = allVideos.filter(v => (v.tier_required || 1) <= currentUserTier);
    document.getElementById("totalVideosStat").innerText = accessible.length;
    document.getElementById("watchedStat").innerText = Object.keys(watchedMap).length;
    document.getElementById("notesCountStat").innerText = userNotes.length;
  }

  function renderTierView(tierNum) {
    if (tierNum > currentUserTier) {
      document.getElementById("dynamicContent").innerHTML = `<div style="text-align:center;padding:80px 20px;background:#F9FAFE;border-radius:2rem;"><h2>🔒 Tier ${tierNum} Locked</h2><p>Upgrade to unlock this content.</p></div>`;
      return;
    }

    const tierVideos = allVideos.filter(v => (v.tier_required || 1) === tierNum);
    const groups = {};
    tierVideos.forEach(v => {
      const cat = getCategoryForVideo(v);
      if (!groups[cat.id]) groups[cat.id] = { ...cat, videos: [] };
      groups[cat.id].videos.push(v);
    });

    let cats = Object.values(groups);
    if (!activeCategoryId || !groups[activeCategoryId]) activeCategoryId = cats[0]?.id;
    const currentCat = groups[activeCategoryId];

    let html = `<div class="two-columns">`;
    html += `<div class="sidebar"><h4 style="padding:0 4px 10px;color:#1A2744;">Categories</h4>`;
    cats.forEach(cat => {
      html += `<div class="category-item ${activeCategoryId === cat.id ? 'active' : ''}" data-id="${cat.id}">${cat.name} <span class="cat-count">${cat.videos.length}</span></div>`;
    });
    html += `</div><div class="main-panel">`;

    if (currentCat) {
      html += `<div class="category-title">${currentCat.name}</div>`;
      html += `<p style="color:#8a99b0;font-size:13px;margin-bottom:14px;">${currentCat.videos.length} video${currentCat.videos.length !== 1 ? 's' : ''}</p>`;
      html += `<div class="video-list" id="videoList">`;
      currentCat.videos.forEach(v => {
        html += `<div class="video-card ${activeVideoId === v.id ? 'active-video' : ''}" data-id="${v.id}">
          <div><strong>${escapeHtml(v.title)}</strong></div>
          <div style="color:#8a99b0;font-size:18px;">${watchedMap[v.id] ? '✅' : '▶️'}</div>
        </div>`;
      });
      html += `</div>`;
    } else {
      html += `<div style="padding:60px 20px;text-align:center;color:#8a99b0;">No videos in this category yet.</div>`;
    }
    html += `</div></div>`;
    document.getElementById("dynamicContent").innerHTML = html;

    document.querySelectorAll('.category-item').forEach(el => {
      el.addEventListener('click', () => {
        activeCategoryId = el.getAttribute('data-id');
        activeVideoId = null;
        renderTierView(tierNum);
      });
    });

    document.querySelectorAll('.video-card').forEach(el => {
      el.addEventListener('click', () => {
        activeVideoId = parseInt(el.getAttribute('data-id'));
        watchedMap[activeVideoId] = true;
        persistWatched();
        updateStatistics();
        renderTierView(tierNum);
      });
    });
  }

  function escapeHtml(text) {
    return text ? text.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]) : '';
  }

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
    activeCategoryId = null;

    if (tab === "notes") {
      document.getElementById("dynamicContent").innerHTML = `<div style="padding:40px;text-align:center;color:#8a99b0;">Notes tab coming soon...</div>`;
    } else {
      const tier = parseInt(tab.replace('tier',''));
      renderTierView(tier);
    }
  }

  document.getElementById("tabContainer").addEventListener("click", e => {
    if (e.target.dataset.tab) switchTab(e.target.dataset.tab);
  });

  window.onload = async () => {
    loadLocal();
    const { data: { user } } = await sbClient.auth.getUser();
    if (user) {
      let tier = 1;
      try {
        const { data: p } = await sbClient.from("profiles").select("membership_tier").eq("email", user.email).maybeSingle();
        tier = p?.membership_tier || 1;
      } catch(e){}
      currentUserTier = Math.min(tier, 3);
      document.getElementById("userTierBadge").innerText = currentUserTier >= 3 ? "Full Access" : `Tier ${currentUserTier}`;
      await loadVideosAndStart();
    }
  };
</script>
</body>
</html>
