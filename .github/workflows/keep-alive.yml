name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 9:00 AM UTC — well inside Supabase's 7-day pause window
    - cron: '0 9 */3 * *'
  workflow_dispatch: # lets you trigger it manually from the GitHub Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to keep project active
        run: |
          curl -s -o /dev/null -w "Status: %{http_code}\n" \
            "https://zwwodopezadqjazhajmx.supabase.co/rest/v1/${{ secrets.SUPABASE_TABLE }}?select=*&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
